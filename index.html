<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Day Units — Designed by Alex Weischer</title>
<style>
  :root{
    --bg:#000; --fg:#f5f5f0; --muted:rgba(245,245,240,.36); --soft:rgba(245,245,240,.10);
    --line:rgba(245,245,240,.18); --ring:rgba(245,245,240,.20); --track:rgba(245,245,240,.12);
    --accent:#ff7a00; --mint:#62ffd2; --center-size:min(80vmin,760px); --app-h:100svh;
  }
  body.light{--bg:#f5f3ec;--fg:#090909;--muted:rgba(9,9,9,.38);--soft:rgba(9,9,9,.08);--line:rgba(9,9,9,.18);--ring:rgba(9,9,9,.18);--track:rgba(9,9,9,.10);--mint:#008f78;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;}
  body{display:grid;place-items:center;}
  .app{width:100vw;height:var(--app-h);min-height:100svh;position:relative;display:grid;place-items:center;padding:30px;background:var(--bg);overflow:hidden;}

  body.fake-fullscreen{position:fixed;inset:0;width:100vw;height:var(--app-h);overflow:hidden;}
  body.fake-fullscreen .app{position:fixed;inset:0;width:100vw;height:var(--app-h);min-height:var(--app-h);z-index:9999;}
  .app:fullscreen{width:100vw;height:100dvh;min-height:100dvh;background:var(--bg);}

  .corner-date,.corner-time{position:absolute;top:max(18px,env(safe-area-inset-top));z-index:20;font-size:11px;letter-spacing:.18em;color:var(--mint);opacity:0;transition:opacity .35s ease;user-select:none;text-shadow:0 0 8px color-mix(in srgb,var(--mint) 24%,transparent);}
  .corner-date{left:max(22px,env(safe-area-inset-left));text-transform:uppercase}.corner-time{right:max(22px,env(safe-area-inset-right));font-variant-numeric:tabular-nums}
  body.show-controls .corner-date,body.show-controls .corner-time{opacity:.72}
  .top{position:absolute;top:calc(50% - var(--center-size)/2 - 44px);left:50%;width:min(78vw,430px);transform:translateX(-50%);display:grid;grid-template-columns:1fr auto 1fr;column-gap:1.28em;align-items:center;font-size:11px;letter-spacing:.12em;color:var(--muted);user-select:none;z-index:10;opacity:0;transition:opacity .35s ease;}
  .top-left{text-align:right}.top-center{text-align:center;letter-spacing:.08em}.top-right{text-align:left} body.show-controls .top{opacity:.58}

  .center{position:absolute;left:50%;top:50%;width:var(--center-size);height:var(--center-size);transform:translate(-50%,-50%);display:grid;place-items:center;z-index:3;}
  .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}.ring-bg{fill:none;stroke:var(--ring);stroke-width:1.55}.ring-left{fill:none;stroke:var(--fg);stroke-width:2.05;stroke-linecap:round;transition:none;}
  .unit-number{position:relative;z-index:2;font-size:clamp(74px,18vw,245px);line-height:.72;letter-spacing:-.08em;font-weight:500;font-variant-numeric:tabular-nums;user-select:none;white-space:nowrap;text-align:center;}
  .unit-label{position:absolute;top:calc(50% + clamp(56px,10vw,134px));left:0;right:0;text-align:center;font-size:clamp(10px,1.35vw,13px);letter-spacing:.22em;text-transform:uppercase;color:var(--accent);user-select:none;}

  .intervals{position:absolute;top:50%;left:calc(50% + var(--center-size)/2 + 34px);transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:12;}
  body.show-controls .intervals{opacity:1;pointer-events:auto}
  button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:0;min-width:46px;height:40px;font:inherit;cursor:pointer;user-select:none;display:grid;place-items:center;transition:background .16s ease,border-color .16s ease,color .16s ease,transform .1s ease,opacity .16s ease;}
  button:hover{background:var(--soft);border-color:color-mix(in srgb,var(--fg) 34%,transparent)}button:active{transform:scale(.96)}
  .intervals button{min-width:56px;height:31px;padding:0 10px;color:var(--muted);font-size:11px;letter-spacing:.10em;border-color:color-mix(in srgb,var(--fg) 16%,transparent);}
  .intervals button.active{color:#050505;border-color:color-mix(in srgb,var(--accent) 82%,var(--fg) 18%);background:var(--accent);box-shadow:0 0 12px color-mix(in srgb,var(--accent) 38%,transparent),inset 0 0 0 1px color-mix(in srgb,#fff 24%,transparent);}

  .daybar-panel{position:absolute;top:50%;right:calc(50% + var(--center-size)/2 + 46px);transform:translateY(-50%);height:min(62vh,430px);width:78px;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:13;}
  body.show-controls .daybar-panel{opacity:1;pointer-events:auto}.time-control{display:grid;grid-template-columns:18px auto 18px;align-items:center;gap:3px;color:var(--muted)}.time-control .time-value{width:40px;text-align:center;font-size:11px;letter-spacing:.10em;font-variant-numeric:tabular-nums;color:var(--fg)}.mini-arrow{min-width:18px;width:18px;height:18px;border:0;color:var(--muted);font-size:12px;background:transparent;border-radius:50%;padding:0}.mini-arrow:hover{color:var(--fg);background:var(--soft)}
  .daybar{position:relative;width:8px;height:100%;border-radius:999px;border:1px solid color-mix(in srgb,var(--fg) 28%,transparent);background:var(--track);overflow:hidden;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bg) 55%,transparent);}
  .daybar-fill{position:absolute;left:0;right:0;bottom:0;height:100%;background:hsl(120 100% 45%);opacity:.92;border-radius:999px;transition:height .5s linear,width .5s linear,background .45s linear}.daybar-now{position:absolute;left:50%;transform:translate(-50%,50%);width:18px;height:1px;background:var(--fg);opacity:.78}.daybar-caption{position:absolute;left:50%;top:calc(100% + 17px);transform:translateX(-50%);color:var(--muted);font-size:9px;letter-spacing:.12em;white-space:nowrap;}

  .controls{position:absolute;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px;opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:30;}
  body.show-controls .controls{opacity:1;pointer-events:auto}.icon-btn{width:46px;height:40px;min-width:46px}.theme-dot{width:17px;height:17px;border-radius:50%;display:block;border:1.15px solid currentColor;background:linear-gradient(90deg,currentColor 0 50%,transparent 50% 100%);opacity:.9}.full-icon{width:18px;height:18px;display:block;position:relative;opacity:.92}.full-icon::before{content:"";position:absolute;inset:0;background:linear-gradient(currentColor,currentColor) left top/7px 1.2px no-repeat,linear-gradient(currentColor,currentColor) left top/1.2px 7px no-repeat,linear-gradient(currentColor,currentColor) right top/7px 1.2px no-repeat,linear-gradient(currentColor,currentColor) right top/1.2px 7px no-repeat,linear-gradient(currentColor,currentColor) left bottom/7px 1.2px no-repeat,linear-gradient(currentColor,currentColor) left bottom/1.2px 7px no-repeat,linear-gradient(currentColor,currentColor) right bottom/7px 1.2px no-repeat,linear-gradient(currentColor,currentColor) right bottom/1.2px 7px no-repeat;}
  .sound-icon{width:19px;height:19px;display:block;opacity:.92;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.sound-muted-line{display:none}body.sound-off .sound-wave{display:none}body.sound-off .sound-muted-line{display:block}
  .flash-icon{width:19px;height:19px;display:block;opacity:.92;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flash-off-line{display:none}body.flash-off .flash-off-line{display:block}body.flash-off .flash-bolt{opacity:.45}
  .ring-toggle-icon{width:19px;height:19px;display:block;opacity:.92;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.ring-toggle-off-line{display:none}body.ring-hidden .ring-toggle-off-line{display:block}body.ring-hidden .ring{opacity:0}

  .volume-panel{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translateX(-50%) translateY(4px);width:158px;height:38px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:9px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--bg) 88%,transparent);color:var(--fg);opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease,background .16s ease,border-color .16s ease;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 28px rgba(0,0,0,.18);}
  body.volume-open.show-controls .volume-panel{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}.volume-panel input[type=range]{width:100%;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer}.volume-panel input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:999px;background:linear-gradient(90deg,var(--fg) var(--volume-percent,100%),var(--soft) var(--volume-percent,100%))}.volume-panel input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--fg);border:0;margin-top:-5.5px}.volume-value{min-width:28px;text-align:right;font-size:9px;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums;user-select:none;}
  body.interval-flash{animation:intervalInvertBlink 2s linear both}@keyframes intervalInvertBlink{0%,10%{filter:invert(1)}11%,23%{filter:invert(0)}24%,34%{filter:invert(1)}35%,47%{filter:invert(0)}48%,58%{filter:invert(1)}59%,100%{filter:invert(0)}}

  /* iPad landscape and tablet fullscreen: bigger central object, controls always safe */
  @media (orientation:landscape) and (min-width:760px) and (max-height:1100px){
    :root{--center-size:min(70vmin,720px)}
    body.fullscreen-mode:root, body.fake-fullscreen:root{--center-size:min(78vmin,820px)}
    body.fullscreen-mode .controls, body.fake-fullscreen .controls, .app:fullscreen .controls{bottom:max(24px,env(safe-area-inset-bottom))!important;}
  }

  /* mobile and narrow windows: real layout, not absolute side columns */
  @media (max-width:700px){
    .app{display:grid;grid-template-rows:minmax(36px,7svh) minmax(42px,8svh) minmax(0,1fr) minmax(34px,7svh) minmax(48px,9svh);grid-template-areas:"top" "bar" "center" "intervals" "controls";gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px);place-items:center;}
    .top{display:none}.corner-date,.corner-time{top:calc(env(safe-area-inset-top) + 10px);font-size:10px}.corner-date{left:16px}.corner-time{right:16px}
    .center{grid-area:center;position:relative;left:auto;top:auto;transform:none;width:min(70vw,42svh,360px);height:min(70vw,42svh,360px);align-self:center;}
    .unit-number{font-size:clamp(74px,23vw,150px)}.unit-label{top:calc(50% + clamp(44px,14vw,80px));font-size:9px;letter-spacing:.17em;}
    .daybar-panel{grid-area:bar;position:relative;top:auto;right:auto;transform:none;width:min(86vw,430px);height:42px;display:grid;grid-template-columns:auto minmax(130px,1fr) auto;grid-template-rows:1fr;gap:8px;align-items:center;justify-items:center;opacity:0;}
    .daybar{width:100%;height:8px}.daybar-fill{top:0;bottom:0;left:0;right:auto;width:100%;height:100%}.daybar-now{top:50%;left:0;transform:translate(-50%,-50%);width:1px;height:18px}.daybar-caption{display:none}.time-control{grid-template-columns:15px auto 15px;gap:1px}.time-control .time-value{width:35px;font-size:9px;letter-spacing:.05em}.mini-arrow{min-width:15px;width:15px;height:18px;font-size:11px}
    .intervals{grid-area:intervals;position:relative;top:auto;left:auto;transform:none;width:min(92vw,440px);display:flex;flex-direction:row;justify-content:center;gap:6px;overflow:visible;opacity:0;}
    .intervals button{min-width:32px;height:27px;padding:0 7px;font-size:9px;letter-spacing:.05em;}
    .controls{grid-area:controls;position:relative;left:auto;bottom:auto;transform:none;align-self:center;gap:9px;opacity:0;}
    .icon-btn{width:44px;min-width:44px;height:38px}.volume-panel{bottom:calc(100% + 10px)}
  }

  /* iPhone landscape: compact rows, nothing overlaps */
  @media (max-height:500px) and (orientation:landscape){
    .app{display:grid;grid-template-rows:34px minmax(0,1fr) 34px 42px;grid-template-areas:"bar" "center" "intervals" "controls";gap:5px;padding:8px max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));place-items:center;}
    .corner-date,.corner-time{display:none}.top{display:none}
    .center{grid-area:center;position:relative;left:auto;top:auto;transform:none;width:min(42vw,50svh,270px);height:min(42vw,50svh,270px);}
    .unit-number{font-size:clamp(62px,16vw,118px)}.unit-label{top:calc(50% + clamp(36px,9vw,62px));font-size:8.5px;letter-spacing:.15em;}
    .daybar-panel{grid-area:bar;position:relative;top:auto;right:auto;transform:none;width:min(72vw,520px);height:30px;display:grid;grid-template-columns:auto minmax(160px,1fr) auto;grid-template-rows:1fr;gap:8px;align-items:center;justify-items:center;opacity:0;}
    .daybar{width:100%;height:7px}.daybar-fill{top:0;bottom:0;left:0;right:auto;width:100%;height:100%}.daybar-now{top:50%;left:0;transform:translate(-50%,-50%);width:1px;height:16px}.time-control .time-value{font-size:9px;width:35px}.mini-arrow{height:16px}
    .intervals{grid-area:intervals;position:relative;top:auto;left:auto;transform:none;width:min(92vw,560px);display:flex;flex-direction:row;justify-content:center;gap:5px;opacity:0;}
    .intervals button{min-width:34px;height:25px;padding:0 6px;font-size:8.5px;}
    .controls{grid-area:controls;position:relative;left:auto;bottom:auto;transform:none;align-self:center;gap:8px}.icon-btn{height:34px;width:42px;min-width:42px}.volume-panel{bottom:calc(100% + 8px)}
  }

  /* fullscreen/fake fullscreen: scale the whole central unit, but keep chrome visible */
  body.fullscreen-mode:not(.fake-fullscreen) .center, body.fake-fullscreen .center, .app:fullscreen .center{width:min(86vmin,880px);height:min(86vmin,880px);}
  body.fullscreen-mode:not(.fake-fullscreen) .unit-number, body.fake-fullscreen .unit-number, .app:fullscreen .unit-number{font-size:clamp(90px,20vw,280px)}
  @media (max-width:700px){body.fake-fullscreen .center{width:min(76vw,48svh,420px);height:min(76vw,48svh,420px)}}
  @media (max-height:500px) and (orientation:landscape){body.fake-fullscreen .center{width:min(44vw,56svh,300px);height:min(44vw,56svh,300px)}body.fake-fullscreen .unit-number{font-size:clamp(64px,17vw,126px)}}


  /* FINAL FIX: robust visible interval flash and clean fullscreen spacing */
  .app::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99999;
    background: var(--fg);
    opacity: 0;
    mix-blend-mode: difference;
  }
  body.interval-flash .app::after {
    animation: visibleIntervalFlash 2s linear both;
  }
  @keyframes visibleIntervalFlash {
    0%, 10% { opacity: .92; }
    11%, 23% { opacity: 0; }
    24%, 34% { opacity: .92; }
    35%, 47% { opacity: 0; }
    48%, 58% { opacity: .92; }
    59%, 100% { opacity: 0; }
  }

  /* In fullscreen/fake-fullscreen on tablets/desktops: do not anchor side elements from an oversized circle. */
  body.fullscreen-mode .app,
  body.fake-fullscreen .app,
  .app:fullscreen {
    --center-size: min(64vmin, 760px);
  }

  body.fullscreen-mode .top,
  body.fake-fullscreen .top,
  .app:fullscreen .top {
    top: max(22px, env(safe-area-inset-top));
    width: min(72vw, 480px);
    z-index: 30;
  }

  body.fullscreen-mode .daybar-panel,
  body.fake-fullscreen .daybar-panel,
  .app:fullscreen .daybar-panel {
    right: calc(50% + var(--center-size) / 2 + clamp(48px, 5.2vw, 86px));
    z-index: 28;
  }

  body.fullscreen-mode .intervals,
  body.fake-fullscreen .intervals,
  .app:fullscreen .intervals {
    left: calc(50% + var(--center-size) / 2 + clamp(38px, 4.5vw, 72px));
    z-index: 28;
  }

  body.fullscreen-mode .center,
  body.fake-fullscreen .center,
  .app:fullscreen .center {
    width: var(--center-size) !important;
    height: var(--center-size) !important;
    z-index: 8;
  }

  body.fullscreen-mode .unit-number,
  body.fake-fullscreen .unit-number,
  .app:fullscreen .unit-number {
    font-size: clamp(96px, calc(var(--center-size) * .28), 270px) !important;
  }

  body.fullscreen-mode .unit-label,
  body.fake-fullscreen .unit-label,
  .app:fullscreen .unit-label {
    top: calc(50% + min(16vmin, 125px));
  }

  /* iPad landscape and similar: keep bottom controls fixed and visible. */
  @media (orientation: landscape) and (min-width: 700px) and (max-height: 920px) {
    body.fullscreen-mode .app,
    body.fake-fullscreen .app,
    .app:fullscreen {
      --center-size: min(58vmin, 620px);
    }
    body.fullscreen-mode .controls,
    body.fake-fullscreen .controls,
    .app:fullscreen .controls {
      position: fixed !important;
      left: 50% !important;
      top: auto !important;
      bottom: max(18px, env(safe-area-inset-bottom)) !important;
      transform: translateX(-50%) !important;
      z-index: 40 !important;
    }
    body.fullscreen-mode .top,
    body.fake-fullscreen .top,
    .app:fullscreen .top {
      top: max(16px, env(safe-area-inset-top));
    }
  }

  /* iPhone/mobile fullscreen uses its own stacked layout; keep the top bar and bottom controls out of the circle. */
  @media (max-width: 700px) {
    body.fake-fullscreen .app,
    body.fullscreen-mode .app {
      grid-template-rows: minmax(40px, 8svh) minmax(0, 1fr) minmax(34px, 7svh) minmax(50px, 10svh);
      grid-template-areas: "bar" "center" "intervals" "controls";
      gap: 8px;
    }
    body.fake-fullscreen .center,
    body.fullscreen-mode .center {
      width: min(74vw, 44svh, 390px) !important;
      height: min(74vw, 44svh, 390px) !important;
    }
    body.fake-fullscreen .unit-label,
    body.fullscreen-mode .unit-label {
      top: calc(50% + clamp(48px, 13vw, 82px));
    }
    body.fake-fullscreen .controls,
    body.fullscreen-mode .controls {
      grid-area: controls;
      position: relative !important;
      left: auto !important;
      top: auto !important;
      bottom: auto !important;
      transform: none !important;
      z-index: 40 !important;
    }
  }

  @media (max-height: 500px) and (orientation: landscape) {
    body.fake-fullscreen .app,
    body.fullscreen-mode .app {
      grid-template-rows: 32px minmax(0,1fr) 32px 40px;
      gap: 4px;
      padding-top: max(6px, env(safe-area-inset-top));
      padding-bottom: max(6px, env(safe-area-inset-bottom));
    }
    body.fake-fullscreen .center,
    body.fullscreen-mode .center {
      width: min(40vw, 52svh, 260px) !important;
      height: min(40vw, 52svh, 260px) !important;
    }
    body.fake-fullscreen .unit-number,
    body.fullscreen-mode .unit-number {
      font-size: clamp(58px, 14vw, 112px) !important;
    }
    body.fake-fullscreen .unit-label,
    body.fullscreen-mode .unit-label {
      top: calc(50% + clamp(34px, 8vw, 58px));
      font-size: 8px;
    }
  }


  /* Mobile/iPhone: hide fullscreen button because iOS Safari does not provide reliable true fullscreen for normal web pages. */
  @media (max-width:700px){
    #full{display:none!important;}
    .controls{gap:12px;}
  }


  /* CLEAN SYNCED FLASH: no CSS filter flicker; JS opens three exact visual pulses matching the three chime tones. */
  body.interval-flash { animation: none !important; filter: none !important; }
  body.interval-flash .app::after { animation: none !important; }
  .app::after { transition: opacity 24ms linear !important; }
  body.flash-pulse .app::after { opacity: .88 !important; }

</style>
</head>
<body>
  <main id="app" class="app" aria-label="Day units left">
    <div id="cornerDate" class="corner-date">JUN 11</div><div id="cornerTime" class="corner-time">10:25</div>
    <div class="top"><span class="top-left">Designed</span><span class="top-center">by</span><span class="top-right">Alex Weischer</span></div>
    <aside class="daybar-panel" aria-label="day start and end time">
      <div class="time-control" aria-label="start time"><button class="mini-arrow" id="startDown" title="start time one hour earlier">‹</button><span id="startTime" class="time-value">08:00</span><button class="mini-arrow" id="startUp" title="start time one hour later">›</button></div>
      <div class="daybar" aria-hidden="true"><div id="daybarFill" class="daybar-fill"></div><div id="daybarNow" class="daybar-now"></div><span class="daybar-caption">DAY</span></div>
      <div class="time-control" aria-label="end time"><button class="mini-arrow" id="endDown" title="end time one hour earlier">‹</button><span id="endTime" class="time-value">24:00</span><button class="mini-arrow" id="endUp" title="end time one hour later">›</button></div>
    </aside>
    <section class="center" aria-label="units left"><svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-bg" cx="50" cy="50" r="47"></circle><circle id="ringLeft" class="ring-left" cx="50" cy="50" r="47"></circle></svg><div id="unitNumber" class="unit-number">000</div><div id="unitLabel" class="unit-label">min</div></section>
    <aside class="intervals" aria-label="intervals"><button data-interval="1" class="active">min</button><button data-interval="5">5m</button><button data-interval="10">10m</button><button data-interval="15">15m</button><button data-interval="20">20m</button><button data-interval="30">30m</button><button data-interval="45">45m</button><button data-interval="60">60m</button><button data-interval="90">90m</button><button data-interval="120">120m</button></aside>

<script>
