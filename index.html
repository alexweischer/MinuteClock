<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Day Units — Designed by Alex Weischer</title>
<style>
  :root {
    --bg: #000;
    --fg: #f5f5f0;
    --muted: rgba(245,245,240,.36);
    --soft: rgba(245,245,240,.10);
    --line: rgba(245,245,240,.18);
    --ring: rgba(245,245,240,.20);
    --track: rgba(245,245,240,.12);
    --accent: #ff7a00;
  }
  body.light {
    --bg: #f5f3ec;
    --fg: #090909;
    --muted: rgba(9,9,9,.36);
    --soft: rgba(9,9,9,.08);
    --line: rgba(9,9,9,.18);
    --ring: rgba(9,9,9,.18);
    --track: rgba(9,9,9,.10);
    --accent: #ff7a00;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  }
  body { display: grid; place-items: center; }
  .app { width: 100vw; height: 100svh; position: relative; display: grid; place-items: center; padding: 30px; }

  .corner-date, .corner-time {
    position: absolute; top: 22px; z-index: 5;
    font-size: 11px; letter-spacing: .18em; color: #62ffd2;
    opacity: 0; transition: opacity .35s ease; user-select: none;
    text-shadow: 0 0 8px rgba(98, 255, 210, 0.22);
  }
  .corner-date { left: 26px; text-transform: uppercase; }
  .corner-time { right: 26px; font-variant-numeric: tabular-nums; }
  body.show-controls .corner-date, body.show-controls .corner-time { opacity: .58; }

  .top {
    position: absolute; top: calc(50% - min(43vmin, 380px) - 44px); left: 50%;
    width: min(78vw, 430px); transform: translateX(-50%);
    display: grid; grid-template-columns: 1fr auto 1fr; column-gap: 1.28em; align-items: center;
    font-size: 11px; letter-spacing: .12em; color: var(--muted); user-select: none; z-index: 5;
    opacity: 0; transition: opacity .35s ease;
  }
  .top-left { text-align: right; }
  .top-center { text-align: center; letter-spacing: .08em; }
  .top-right { text-align: left; }
  body.show-controls .top { opacity: .58; }

  .center {
    position: relative; width: min(86vmin, 760px); height: min(86vmin, 760px);
    display: grid; place-items: center; transform: translateY(-1.5vh);
  }
  .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .ring-bg { fill: none; stroke: var(--ring); stroke-width: 1.55; }
  .ring-left { fill: none; stroke: var(--fg); stroke-width: 2.05; stroke-linecap: round; transition: none; }

  body.interval-flash {
    animation: intervalInvertBlink 2s linear both;
  }

  @keyframes intervalInvertBlink {
    0%, 10% { filter: invert(1); }
    11%, 23% { filter: invert(0); }
    24%, 34% { filter: invert(1); }
    35%, 47% { filter: invert(0); }
    48%, 58% { filter: invert(1); }
    59%, 100% { filter: invert(0); }
  }

  .unit-number {
    position: relative; z-index: 2;
    font-size: clamp(74px, 18vw, 245px); line-height: .72;
    letter-spacing: -.08em; font-weight: 500; font-variant-numeric: tabular-nums;
    user-select: none; white-space: nowrap; text-align: center;
  }
  .unit-label {
    position: absolute; top: calc(50% + clamp(56px, 10vw, 134px)); left: 0; right: 0;
    text-align: center; font-size: clamp(10px, 1.35vw, 13px);
    letter-spacing: .22em; text-transform: uppercase; color: var(--muted); user-select: none;
    display: flex; align-items: center; justify-content: center; gap: .55em;
  }
  .unit-label .unit-phrase {
    color: var(--accent);
    background: transparent;
    border: 0;
    border-radius: 0;
    padding: 0;
    box-shadow: none;
  }
  body.light .unit-label .unit-phrase {
    color: var(--accent);
  }

  .intervals {
    position: absolute;
    top: 50%;
    left: calc(50% + min(43vmin, 380px) + 34px);
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 10px;
    opacity: 0; transition: opacity .35s ease; z-index: 7;
  }
  body.show-controls .intervals { opacity: 1; }
  button {
    appearance: none; border: 1px solid var(--line); background: transparent; color: var(--fg);
    border-radius: 999px; padding: 0; min-width: 46px; height: 40px;
    font: inherit; cursor: pointer; user-select: none; display: grid; place-items: center;
    transition: background .16s ease, border-color .16s ease, color .16s ease, transform .1s ease, opacity .16s ease;
  }
  button:hover { background: var(--soft); border-color: color-mix(in srgb, var(--fg) 34%, transparent); }
  button:active { transform: scale(.96); }
  .intervals button {
    min-width: 56px; height: 31px; padding: 0 10px; color: var(--muted);
    font-size: 11px; letter-spacing: .10em; border-color: color-mix(in srgb, var(--fg) 16%, transparent);
  }
  .intervals button.active {
    color: #050505;
    border-color: color-mix(in srgb, var(--accent) 82%, var(--fg) 18%);
    background: var(--accent);
    box-shadow:
      0 0 12px color-mix(in srgb, var(--accent) 38%, transparent),
      inset 0 0 0 1px color-mix(in srgb, #fff 24%, transparent);
  }
  body.light .intervals button.active {
    color: #050505;
    border-color: color-mix(in srgb, var(--accent) 72%, #000 28%);
    background: var(--accent);
    box-shadow:
      0 0 10px color-mix(in srgb, var(--accent) 24%, transparent),
      inset 0 0 0 1px color-mix(in srgb, #fff 30%, transparent);
  }

  .daybar-panel {
    position: absolute;
    top: 50%;
    right: calc(50% + min(43vmin, 380px) + 46px);
    transform: translateY(-50%);
    height: min(62vh, 430px);
    width: 78px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    justify-items: center;
    gap: 12px;
    opacity: 0; pointer-events: none; transition: opacity .35s ease; z-index: 8;
  }
  body.show-controls .daybar-panel { opacity: 1; pointer-events: auto; }
  .time-control { display: grid; grid-template-columns: 18px auto 18px; align-items: center; gap: 3px; color: var(--muted); }
  .time-control .time-value {
    width: 40px; text-align: center; font-size: 11px; letter-spacing: .10em;
    font-variant-numeric: tabular-nums; color: var(--fg);
  }
  .mini-arrow {
    min-width: 18px; width: 18px; height: 18px; border: 0; color: var(--muted);
    font-size: 12px; background: transparent; border-radius: 50%; padding: 0;
  }
  .mini-arrow:hover { color: var(--fg); background: var(--soft); }
  .daybar {
    position: relative; width: 8px; height: 100%; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--fg) 28%, transparent);
    background: var(--track); overflow: hidden;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bg) 55%, transparent);
  }
  .daybar-fill {
    position: absolute; left: 0; right: 0; bottom: 0; height: 100%;
    background: hsl(120 100% 45%); opacity: .92; border-radius: 999px;
    transition: height .5s linear, background-color .45s linear, background .45s linear;
  }
  .daybar-now {
    position: absolute; left: 50%; transform: translate(-50%, 50%);
    width: 18px; height: 1px; background: var(--fg); opacity: .78;
  }
  .daybar-caption { position: absolute; left: 50%; top: calc(100% + 17px); transform: translateX(-50%); color: var(--muted); font-size: 9px; letter-spacing: .12em; white-space: nowrap; }

  .controls {
    position: absolute;
    left: 50%; top: calc(50% + min(43vmin, 380px) + 18px);
    transform: translateX(-50%);
    display: flex; gap: 10px; opacity: 0; transition: opacity .35s ease; z-index: 6;
  }
  body.show-controls .controls { opacity: 1; }
  .icon-btn { width: 46px; height: 40px; min-width: 46px; }
  .theme-dot {
    width: 17px; height: 17px; border-radius: 50%; display: block;
    border: 1.15px solid currentColor;
    background: linear-gradient(90deg, currentColor 0 50%, transparent 50% 100%);
    opacity: .9;
  }
  .full-icon {
    width: 18px; height: 18px; display: block; position: relative; opacity: .92;
  }
  .full-icon::before {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(currentColor,currentColor) left top/7px 1.2px no-repeat,
      linear-gradient(currentColor,currentColor) left top/1.2px 7px no-repeat,
      linear-gradient(currentColor,currentColor) right top/7px 1.2px no-repeat,
      linear-gradient(currentColor,currentColor) right top/1.2px 7px no-repeat,
      linear-gradient(currentColor,currentColor) left bottom/7px 1.2px no-repeat,
      linear-gradient(currentColor,currentColor) left bottom/1.2px 7px no-repeat,
      linear-gradient(currentColor,currentColor) right bottom/7px 1.2px no-repeat,
      linear-gradient(currentColor,currentColor) right bottom/1.2px 7px no-repeat;
  }


  .sound-icon {
    width: 19px; height: 19px; display: block; opacity: .92;
    fill: none; stroke: currentColor; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .sound-muted-line { display: none; }
  body.sound-off .sound-wave { display: none; }
  body.sound-off .sound-muted-line { display: block; }


  .volume-panel {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 12px);
    transform: translateX(-50%) translateY(4px);
    width: 158px;
    height: 38px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 9px;
    padding: 0 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    color: var(--fg);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease, transform .22s ease, background .16s ease, border-color .16s ease;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 28px rgba(0,0,0,.18);
  }
  body.volume-open.show-controls .volume-panel {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .volume-panel input[type="range"] {
    width: 100%;
    margin: 0;
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    cursor: pointer;
  }
  .volume-panel input[type="range"]::-webkit-slider-runnable-track {
    height: 3px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--fg) var(--volume-percent, 75%), var(--soft) var(--volume-percent, 75%));
  }
  .volume-panel input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--fg);
    border: 0;
    margin-top: -5.5px;
  }
  .volume-panel input[type="range"]::-moz-range-track {
    height: 3px;
    border-radius: 999px;
    background: var(--soft);
  }
  .volume-panel input[type="range"]::-moz-range-progress {
    height: 3px;
    border-radius: 999px;
    background: var(--fg);
  }
  .volume-panel input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--fg);
    border: 0;
  }
  .volume-value {
    min-width: 28px;
    text-align: right;
    font-size: 9px;
    letter-spacing: .08em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }


  @media (max-width: 900px) {
    .center { width: min(82vmin, 620px); height: min(82vmin, 620px); }
    .intervals { left: auto; right: 16px; gap: 7px; }
    .intervals button { min-width: 46px; height: 30px; padding: 0 8px; }
    .daybar-panel { right: auto; left: 12px; height: min(58vh, 370px); width: 64px; }
    .controls { top: auto; bottom: max(18px, env(safe-area-inset-bottom)); }
    .top { top: 16px; width: min(68vw, 360px); }
  }
  @media (max-width: 520px) {
    .app { padding: 18px; }
    .unit-number { font-size: clamp(72px, 24vw, 148px); }
    .unit-label { top: calc(50% + clamp(44px, 14vw, 72px)); font-size: 9px; letter-spacing: .17em; }
    .intervals { right: 8px; }
    .intervals button { min-width: 38px; height: 27px; font-size: 9px; }
    .daybar-panel { left: 6px; width: 56px; height: min(52vh, 330px); }
    .time-control { grid-template-columns: 14px auto 14px; gap: 1px; }
    .time-control .time-value { width: 32px; font-size: 9px; letter-spacing: .05em; }
    .mini-arrow { min-width: 14px; width: 14px; height: 16px; font-size: 10px; }
  }
</style>
</head>
<body>
  <main class="app" aria-label="Day units left">
    <div id="cornerDate" class="corner-date">JUN 11</div>
    <div id="cornerTime" class="corner-time">10:25</div>
    <div class="top"><span class="top-left">Designed</span><span class="top-center">by</span><span class="top-right">Alex Weischer</span></div>

    <aside class="daybar-panel" aria-label="day start and end time">
      <div class="time-control" aria-label="start time">
        <button class="mini-arrow" id="startDown" title="start time one hour earlier">‹</button>
        <span id="startTime" class="time-value">08:00</span>
        <button class="mini-arrow" id="startUp" title="start time one hour later">›</button>
      </div>
      <div class="daybar" aria-hidden="true">
        <div id="daybarFill" class="daybar-fill"></div>
        <div id="daybarNow" class="daybar-now"></div>
        <span class="daybar-caption">DAY</span>
      </div>
      <div class="time-control" aria-label="end time">
        <button class="mini-arrow" id="endDown" title="end time one hour earlier">‹</button>
        <span id="endTime" class="time-value">24:00</span>
        <button class="mini-arrow" id="endUp" title="end time one hour later">›</button>
      </div>
    </aside>

    <section class="center" aria-label="units left">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-bg" cx="50" cy="50" r="47"></circle>
        <circle id="ringLeft" class="ring-left" cx="50" cy="50" r="47"></circle>
      </svg>
      <div id="unitNumber" class="unit-number">000</div>
      <div id="unitLabel" class="unit-label"><span class="unit-phrase">5 min</span></div>
    </section>

    <aside class="intervals" aria-label="intervals">
      <button data-interval="1">1m</button>
      <button data-interval="5" class="active">5m</button>
      <button data-interval="10">10m</button>
      <button data-interval="15">15m</button>
      <button data-interval="20">20m</button>
      <button data-interval="30">30m</button>
      <button data-interval="45">45m</button>
      <button data-interval="60">60m</button>
      <button data-interval="90">90m</button>
      <button data-interval="120">120m</button>
    </aside>

    <div class="controls">
      <button id="theme" class="icon-btn" aria-label="color mode"><span class="theme-dot"></span></button>
      <button id="sound" class="icon-btn" aria-label="sound volume" title="Volume">
        <svg class="sound-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9.5h3.4L12 5.8v12.4l-4.6-3.7H4z"></path>
          <path class="sound-wave" d="M15.4 8.4c1.15 1.15 1.15 6.05 0 7.2"></path>
          <path class="sound-wave" d="M18.2 5.9c2.45 2.45 2.45 9.75 0 12.2"></path>
          <path class="sound-muted-line" d="M5.2 5.2l13.6 13.6"></path>
        </svg>
      </button>
      <div id="volumePanel" class="volume-panel" aria-label="volume control">
        <input id="volumeSlider" type="range" min="0" max="100" value="90" aria-label="volume" />
        <span id="volumeValue" class="volume-value">90</span>
      </div>
      <button id="full" class="icon-btn" aria-label="fullscreen"><span class="full-icon"></span></button>
    </div>
  </main>

<script>
(() => {
  const unitNumber = document.getElementById('unitNumber');
  const unitLabel = document.getElementById('unitLabel');
  const ringLeft = document.getElementById('ringLeft');
  const daybarFill = document.getElementById('daybarFill');
  const daybarNow = document.getElementById('daybarNow');
  const cornerDate = document.getElementById('cornerDate');
  const cornerTime = document.getElementById('cornerTime');
  const startTimeEl = document.getElementById('startTime');
  const endTimeEl = document.getElementById('endTime');
  const intervalButtons = [...document.querySelectorAll('.intervals button')];
  const themeBtn = document.getElementById('theme');
  const soundBtn = document.getElementById('sound');
  const volumePanel = document.getElementById('volumePanel');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeValue = document.getElementById('volumeValue');
  const fullBtn = document.getElementById('full');

  const radius = 47;
  const circumference = 2 * Math.PI * radius;
  ringLeft.style.strokeDasharray = circumference;

  let startHour = Number(localStorage.getItem('dayUnitsStartHour') || 8);
  let endHour = Number(localStorage.getItem('dayUnitsEndHour') || 24);
  let intervalMinutes = Number(localStorage.getItem('dayUnitsInterval') || 5);
  let hideTimer = null;
  let soundVolume = Number(localStorage.getItem('dayUnitsSoundVolume') || 90) / 100;
  if (!Number.isFinite(soundVolume)) soundVolume = 0.90;
  soundVolume = Math.max(0, Math.min(1, soundVolume));
  let soundEnabled = soundVolume > 0 && localStorage.getItem('dayUnitsSound') !== 'off';
  let audioCtx = null;
  let lastCompletedSlot = null;
  let flashTimer = null;
  let frameHandle = null;
  let soundPresetIndex = Number(localStorage.getItem('dayUnitsSoundPreset') || 0);
  if (!Number.isFinite(soundPresetIndex)) soundPresetIndex = 0;

  const BASE_INTERVAL_FREQS = [293.66, 349.23, 587.33]; // D4 · F4 · D5
  const SOUND_PRESET = {
    name: 'Muted square',
    wave: 'square',
    filter: 1350,
    q: 0.14,
    peak: 0.055,
    attack: 0.028,
    scale: 0.92,
    partials: [[1,1],[2,0.025],[3,0.006]]
  };

  function clampDay() {
    startHour = Math.max(0, Math.min(23, startHour));
    endHour = Math.max(1, Math.min(24, endHour));
    if (endHour <= startHour) endHour = Math.min(24, startHour + 1);
  }
  function formatHour(h) { return String(h).padStart(2, '0') + ':00'; }
  function minutesOfDay(date) { return date.getHours() * 60 + date.getMinutes() + date.getSeconds() / 60 + date.getMilliseconds() / 60000; }
  function padNumber(n) { return String(Math.max(0, n)).padStart(2, '0'); }

  function updateCornerTime() {
    const now = new Date();
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    cornerDate.textContent = `${months[now.getMonth()]} ${now.getDate()}`;
    cornerTime.textContent = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  }


  function getAudioContext() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return null;
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    } catch (_) { return null; }
  }

  function effectiveSoundVolume() {
    if (soundVolume <= 0) return 0;
    // Perceptual boost: the slider middle should already be clearly audible.
    // 50 now behaves much louder than a linear 50, while 100 stays controlled.
    return Math.min(1.55, 0.30 + 1.25 * Math.pow(soundVolume, 0.55));
  }

  function playSelectedChime({ force = false } = {}) {
    if ((!soundEnabled || soundVolume <= 0) && !force) return;
    const ctx = getAudioContext();
    if (!ctx) return;
    const preset = SOUND_PRESET;
    const v = Math.max(0.22, effectiveSoundVolume());
    const start = ctx.currentTime;

    // Three pulses, rhythmically aligned with the three visual flashes:
    // ta — ta — taa. The third pulse is slightly longer so the ending is distinct.
    const offsets = [0.02, 0.50, 0.98];
    const durations = [0.26, 0.26, 0.52];

    const master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, start);
    master.gain.linearRampToValueAtTime(0.88 * v, start + 0.035);
    master.gain.setValueAtTime(0.88 * v, start + 1.34);
    master.gain.exponentialRampToValueAtTime(0.0001, start + 1.66);

    const toneFilter = ctx.createBiquadFilter();
    toneFilter.type = 'lowpass';
    toneFilter.frequency.setValueAtTime(preset.filter, start);
    toneFilter.Q.setValueAtTime(preset.q || 0.20, start);
    toneFilter.connect(master).connect(ctx.destination);

    offsets.forEach((offset, pulseIndex) => {
      const t = start + offset;
      const baseFreq = BASE_INTERVAL_FREQS[pulseIndex];
      const duration = durations[pulseIndex] * (preset.scale || 1);
      const peak = preset.peak * (pulseIndex === 2 ? 1.14 : 1.0);
      const attack = preset.attack || 0.030;
      const partials = preset.partials || [[1,1]];

      partials.forEach(([ratio, relGain], i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = i === 0 ? preset.wave : 'sine';
        osc.frequency.setValueAtTime(baseFreq * ratio, t);
        if (preset.detune) osc.detune.setValueAtTime(preset.detune * (i + 1), t);
        if (pulseIndex === 2 && i === 0) {
          osc.frequency.linearRampToValueAtTime(baseFreq * ratio * 1.003, t + duration * 0.70);
        }
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.linearRampToValueAtTime(peak * relGain, t + attack);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
        osc.connect(gain).connect(toneFilter);
        osc.start(t);
        osc.stop(t + duration + 0.045);
      });

      if (preset.noise) {
        const bufferSize = Math.floor(ctx.sampleRate * Math.min(0.16, duration));
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          const x = i / bufferSize;
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - x, 3.6);
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const noiseFilter = ctx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        noiseFilter.frequency.setValueAtTime(Math.min(5200, preset.filter * 0.85), t);
        noiseFilter.Q.setValueAtTime(0.75, t);
        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.0001, t);
        noiseGain.gain.linearRampToValueAtTime(preset.noise * peak, t + 0.010);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + Math.min(0.16, duration));
        noise.connect(noiseFilter).connect(noiseGain).connect(toneFilter);
        noise.start(t);
        noise.stop(t + Math.min(0.18, duration + 0.02));
      }
    });
  }

  function softIntervalChime() {
    playSelectedChime();
  }

  function tinyClick() {
    const ctx = getAudioContext();
    if (!ctx) return;
    const v = effectiveSoundVolume();
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(520, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.020 * Math.max(0.35, v), t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.09);
  }

  function applySoundState() {
    soundEnabled = soundVolume > 0;
    localStorage.setItem('dayUnitsSound', soundEnabled ? 'on' : 'off');
    localStorage.setItem('dayUnitsSoundVolume', String(Math.round(soundVolume * 100)));
    const percent = Math.round(soundVolume * 100);
    document.body.classList.toggle('sound-off', !soundEnabled);
    if (soundBtn) soundBtn.title = soundEnabled ? `Volume ${percent}` : 'Muted';
    if (soundBtn) soundBtn.setAttribute('aria-label', soundEnabled ? `volume ${percent}` : 'muted');
    if (volumeSlider) volumeSlider.value = String(percent);
    if (volumeValue) volumeValue.textContent = String(percent);
    if (volumePanel) volumePanel.style.setProperty('--volume-percent', `${percent}%`);
  }


  function triggerVisualIntervalSignal() {
    document.body.classList.remove('interval-flash');
    // Force-restart the CSS animation even if two intervals trigger close together.
    void document.body.offsetWidth;
    document.body.classList.add('interval-flash');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => document.body.classList.remove('interval-flash'), 2050);
  }

  function render() {
    clampDay();
    const now = new Date();
    const current = minutesOfDay(now);
    const start = startHour * 60;
    const end = endHour * 60;
    const dayLength = Math.max(1, end - start);
    const elapsed = Math.max(0, Math.min(dayLength, current - start));
    const remaining = Math.max(0, dayLength - elapsed);
    const unitsLeft = Math.ceil(remaining / intervalMinutes);

    const completedSlot = Math.floor(elapsed / intervalMinutes);
    if (lastCompletedSlot === null || current < start || current >= end) {
      lastCompletedSlot = completedSlot;
    } else if (completedSlot > lastCompletedSlot) {
      lastCompletedSlot = completedSlot;
      softIntervalChime();
      triggerVisualIntervalSignal();
    }

    unitNumber.textContent = padNumber(unitsLeft);
    const activeUnitLabel = intervalMinutes === 1 ? 'min' : `${intervalMinutes} min`;
    unitLabel.innerHTML = `<span class="unit-phrase">${activeUnitLabel}</span>`;

    // Ring drains smoothly inside the current selected interval.
    const intervalRemainder = remaining <= 0 ? 0 : remaining % intervalMinutes;
    const intervalProgressLeft = remaining <= 0 ? 0 : (intervalRemainder === 0 ? 1 : intervalRemainder / intervalMinutes);
    ringLeft.style.strokeDashoffset = circumference * (1 - intervalProgressLeft);

    const dayLeft = Math.max(0, Math.min(1, remaining / dayLength));
    daybarFill.style.height = `${dayLeft * 100}%`;
    const dayHue = dayLeft * 120;
    daybarFill.style.background = `hsl(${dayHue} 100% 45%)`;
    const nowPosition = Math.max(0, Math.min(1, elapsed / dayLength));
    daybarNow.style.bottom = `${(1 - nowPosition) * 100}%`;

    startTimeEl.textContent = formatHour(startHour);
    endTimeEl.textContent = formatHour(endHour);
    intervalButtons.forEach(btn => btn.classList.toggle('active', Number(btn.dataset.interval) === intervalMinutes));
    updateCornerTime();
  }

  function setStart(delta) {
    startHour += delta;
    if (startHour < 0) startHour = 0;
    if (startHour >= endHour) startHour = endHour - 1;
    localStorage.setItem('dayUnitsStartHour', startHour);
    lastCompletedSlot = null;
    render();
  }
  function setEnd(delta) {
    endHour += delta;
    if (endHour > 24) endHour = 24;
    if (endHour <= startHour) endHour = startHour + 1;
    localStorage.setItem('dayUnitsEndHour', endHour);
    lastCompletedSlot = null;
    render();
  }

  document.getElementById('startDown').addEventListener('click', () => setStart(-1));
  document.getElementById('startUp').addEventListener('click', () => setStart(1));
  document.getElementById('endDown').addEventListener('click', () => setEnd(-1));
  document.getElementById('endUp').addEventListener('click', () => setEnd(1));

  intervalButtons.forEach(btn => btn.addEventListener('click', () => {
    intervalMinutes = Number(btn.dataset.interval);
    localStorage.setItem('dayUnitsInterval', intervalMinutes);
    lastCompletedSlot = null;
    render();
  }));

  soundBtn.addEventListener('click', (event) => {
    event.stopPropagation();
    getAudioContext();
    document.body.classList.toggle('volume-open');
    if (soundVolume <= 0) soundVolume = 0.85;
    applySoundState();
    tinyClick();
    showControls();
  });

  volumePanel.addEventListener('click', (event) => event.stopPropagation());
  volumePanel.addEventListener('pointerdown', () => showControls());
  volumeSlider.addEventListener('input', () => {
    soundVolume = Math.max(0, Math.min(1, Number(volumeSlider.value) / 100));
    applySoundState();
    showControls();
  });
  volumeSlider.addEventListener('change', () => {
    if (soundVolume > 0) tinyClick();
  });
  window.addEventListener('pointerdown', (event) => {
    if (!event.target.closest('#sound') && !event.target.closest('#volumePanel')) {
      document.body.classList.remove('volume-open');
    }
  });

  themeBtn.addEventListener('click', () => {
    document.body.classList.toggle('light');
    localStorage.setItem('dayUnitsTheme', document.body.classList.contains('light') ? 'light' : 'dark');
  });
  if (localStorage.getItem('dayUnitsTheme') === 'light') document.body.classList.add('light');

  fullBtn.addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch (_) {}
  });

  function showControls() {
    document.body.classList.add('show-controls');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => document.body.classList.remove('show-controls'), 2400);
  }
  ['mousemove','touchstart','pointerdown','keydown'].forEach(evt => window.addEventListener(evt, showControls, { passive: true }));

  applySoundState();
  clampDay();
  function animationLoop() {
    render();
    frameHandle = requestAnimationFrame(animationLoop);
  }
  if (frameHandle) cancelAnimationFrame(frameHandle);
  animationLoop();
  showControls();
})();
</script>
</body>
</html>
