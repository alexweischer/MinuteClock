<!doctype html>
<html lang="en">
<head>
  <!-- app-version: v92-fullscreen-top-date-time-refined -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Day Left" />
  <title>Day Left</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --fg: #f4f1ea;
      --muted: rgba(244, 241, 234, 0.58);
      --line: rgba(244, 241, 234, 0.18);
      --track: rgba(244, 241, 234, 0.14);
      --orange: #d96a19;
      --yellow: #746a3c;
      --mint: #4b7470;
      --danger-bg: #160606;
      --danger-fg: #fff0ee;
      --danger-muted: rgba(255, 240, 238, 0.62);
      --danger-line: rgba(217, 74, 67, 0.34);
      --danger-red: #d94a43;
      --danger-track: rgba(217, 74, 67, 0.20);
      --time-1000: #4caf50;
      --time-900: #63b84c;
      --time-800: #86bd45;
      --time-700: #a8bd3d;
      --time-600: #c7b935;
      --time-500: #d9a52e;
      --time-400: #dc8628;
      --time-300: #d96a22;
      --time-200: #d4511f;
      --time-100: #cc3428;
      --time-0: #b91f1f;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    main {
      width: min(94vw, 760px);
      aspect-ratio: 1 / 1;
      max-height: 94dvh;
      border: 1px solid var(--line);
      border-radius: 34px;
      padding: clamp(24px, 4.8vw, 46px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(20px, 3vw, 34px);
      position: relative;
      background: var(--bg);
      color: var(--fg);
      box-shadow: 0 18px 60px rgba(0,0,0,0.24);
    }

    .settings {
      position: absolute;
      left: 50%;
      top: clamp(18px, 4vw, 34px);
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .settings.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .icon-button {
      appearance: none;
      -webkit-appearance: none;
      width: 34px;
      height: 34px;
      min-width: 34px;
      min-height: 34px;
      border: 1px solid var(--line);
      color: var(--fg);
      background: transparent;
      border-radius: 50%;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-sizing: border-box;
    }

    .theme-dot {
      width: 13px;
      height: 13px;
      min-width: 13px;
      min-height: 13px;
      max-width: 13px;
      max-height: 13px;
      display: block;
      background: var(--fg);
      border-radius: 50%;
      flex: 0 0 13px;
      box-sizing: border-box;
    }
.fullscreen-button svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fullscreen-exit {
      display: none;
    }

    :fullscreen .fullscreen-enter {
      display: none;
    }

    :fullscreen .fullscreen-exit {
      display: block;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      color: var(--muted);
      font-size: clamp(10px, 1.8vw, 13px);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }

    #clock {
      color: var(--mint);
    }

    #dateLabel {
      color: var(--yellow);
    }

    .countdown {
      text-align: center;
      transition: color 240ms ease;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: clamp(10px, 2vw, 18px);
      min-height: 0;
      position: relative;
    }
#minutes {
      font-size: clamp(108px, 24vw, 220px);
      font-weight: 500;
      line-height: 0.80;
      letter-spacing: -0.065em;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .label {
      color: var(--fg);
      font-size: clamp(13px, 2.4vw, 20px);
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      opacity: 0.70;
    }


    #numberHitArea {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -58%);
      width: min(78vw, 520px);
      height: clamp(130px, 28vw, 260px);
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0;
      cursor: pointer;
      z-index: 4;
      appearance: none;
      -webkit-appearance: none;
    }

    #numberHitArea:focus-visible {
      outline: 1px solid var(--fg);
      outline-offset: 6px;
      border-radius: 18px;
    }


    .designer-credit {
      position: absolute;
      left: 50%;
      bottom: clamp(14px, 2.6vw, 22px);
      transform: translateX(-50%);
      color: var(--muted);
      opacity: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      font-size: clamp(8px, 1.35vw, 10px);
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: none;
      white-space: nowrap;
      transition: opacity 0.18s ease;
      z-index: 2;
    }

    main.controls-visible .designer-credit {
      opacity: 0.22;
    }

    main:fullscreen .designer-credit,
    main:-webkit-full-screen .designer-credit,
    body.fake-fullscreen .designer-credit {
      bottom: max(10px, env(safe-area-inset-bottom));
      font-size: clamp(9px, 1.15vw, 13px);
    }


    /* Slightly clearer credit in black/red night mode */
    body.night-mode:not(.night-inverted) main.controls-visible .designer-credit {
      opacity: 0.34;
      color: rgba(255, 68, 58, 0.62);
      text-shadow:
        0 0 5px rgba(255, 68, 58, 0.26),
        0 0 14px rgba(255, 68, 58, 0.14);
    }

    .remaining-section {
      width: min(76%, 540px);
      justify-self: center;
      align-self: end;
      display: grid;
      gap: 8px;
    }

    .remaining-labels {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      align-items: center;
      color: var(--muted);
      font-size: clamp(9px, 1.5vw, 11px);
      letter-spacing: 0.09em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }

    .remaining-labels span:nth-child(2) {
      text-align: center;
    }

    #remainingPercent {
      color: var(--muted);
      text-transform: none;
    }

    .remaining-labels span:nth-child(3) {
      text-align: right;
    }

    .remaining-track {
      position: relative;
      width: 100%;
      height: 6px;
      background: var(--track);
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      display: block;
    }

    .remaining-fill {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: 100%;
      background: var(--orange);
      border-radius: 999px;
      display: block;
      transition: width 0.25s linear, background 240ms ease;
    }

    .light {
      --bg: #f4f1ea;
      --fg: #111;
      --muted: rgba(17, 17, 17, 0.55);
      --line: rgba(17, 17, 17, 0.16);
      --track: rgba(17, 17, 17, 0.10);
      --yellow: #8c7a24;
      --mint: #3f827c;
      --danger-bg: #fff0ee;
      --danger-fg: #210504;
      --danger-muted: rgba(33, 5, 4, 0.56);
      --danger-line: rgba(185, 59, 53, 0.30);
      --danger-red: #b93b35;
      --danger-track: rgba(185, 59, 53, 0.14);
    }


    /* Night mode: 00:00–07:59, red-only visual system */
    body.night-mode {
      --bg: #070202;
      --fg: #ff443a;
      --muted: rgba(255, 59, 52, 0.46);
      --line: rgba(255, 59, 52, 0.20);
      --track: rgba(255, 59, 52, 0.13);
      --orange: #ff443a;
      --yellow: #c82f2a;
      --mint: #e0443d;
      --danger-bg: #070202;
      --danger-fg: #ff443a;
      --danger-muted: rgba(255, 59, 52, 0.46);
      --danger-line: rgba(255, 59, 52, 0.20);
      --danger-red: #ff443a;
      --danger-track: rgba(255, 59, 52, 0.13);
    }

    body.night-mode.night-inverted {
      --bg: #b51f1a;
      --fg: #080202;
      --muted: rgba(8, 2, 2, 0.56);
      --line: rgba(8, 2, 2, 0.24);
      --track: rgba(8, 2, 2, 0.16);
      --orange: #080202;
      --yellow: #170404;
      --mint: #100303;
      --danger-bg: #b51f1a;
      --danger-fg: #080202;
      --danger-muted: rgba(8, 2, 2, 0.56);
      --danger-line: rgba(8, 2, 2, 0.24);
      --danger-red: #080202;
      --danger-track: rgba(8, 2, 2, 0.16);
    }

    body.night-mode #minutes,
    body.night-mode .label,
    body.night-mode #clock,
    body.night-mode #dateLabel,
    body.night-mode #remainingPercent,
    body.night-mode .remaining-labels,
    body.night-mode .icon-button,
    body.night-mode .designer-credit {
      color: var(--fg);
      text-shadow: none;
    }

    body.night-mode .top {
      color: var(--muted);
    }

    body.night-mode #dateLabel {
      color: var(--yellow);
    }

    body.night-mode #clock {
      color: var(--mint);
    }

    body.night-mode .label,
    body.night-mode #remainingPercent,
    body.night-mode .remaining-labels,
    body.night-mode .designer-credit {
      color: var(--muted);
    }

    body.night-mode .remaining-track {
      background: var(--track);
      border-color: var(--line);
    }

    body.night-mode .remaining-fill {
      background: var(--orange) !important;
    }

    body.night-mode main {
      background: var(--bg);
      color: var(--fg);
      box-shadow: none;
    }

    body.night-mode .theme-dot {
      background: var(--fg);
    }

    body.tomorrow-mode {
      --bg: var(--danger-bg);
      --fg: var(--danger-fg);
      --muted: var(--danger-muted);
      --line: var(--danger-line);
      --track: var(--danger-track);
      --orange: var(--danger-red);
      --yellow: var(--danger-red);
      --mint: var(--danger-red);
    }

    body.tomorrow-mode #minutes,
    body.tomorrow-mode .label,
    body.tomorrow-mode #clock,
    body.tomorrow-mode #dateLabel,
    body.tomorrow-mode #remainingPercent,
    body.tomorrow-mode .remaining-labels,
    body.tomorrow-mode .icon-button {
      color: var(--danger-red);
      text-shadow: none;
    }

    body.tomorrow-mode .remaining-fill {
      left: 0;
      right: auto;
    }

    body.tomorrow-mode .remaining-track {
      border-color: var(--danger-line);
      background: var(--danger-track);
    }

    body.tomorrow-mode main {
      box-shadow: none;
    }



    /* Night alarm clock glow */
    body.night-mode #minutes {
      text-shadow:
        0 0 8px rgba(255, 59, 52, 0.42),
        0 0 22px rgba(255, 59, 52, 0.24),
        0 0 46px rgba(255, 59, 52, 0.14);
    }

    body.night-mode .label,
    body.night-mode #clock,
    body.night-mode #dateLabel,
    body.night-mode #remainingPercent,
    body.night-mode .remaining-labels,
    body.night-mode .icon-button,
    body.night-mode .designer-credit {
      text-shadow:
        0 0 6px rgba(255, 59, 52, 0.30),
        0 0 18px rgba(255, 59, 52, 0.16);
    }

    body.night-mode .remaining-fill {
      box-shadow:
        0 0 7px rgba(255, 59, 52, 0.48),
        0 0 18px rgba(255, 59, 52, 0.24);
    }

    body.night-mode .remaining-track {
      box-shadow:
        inset 0 0 8px rgba(255, 59, 52, 0.08),
        0 0 10px rgba(255, 59, 52, 0.10);
    }






    /* Inverted red/black night theme: flat black signs, no glow */
    body.night-mode.night-inverted #minutes,
    body.night-mode.night-inverted .label,
    body.night-mode.night-inverted #clock,
    body.night-mode.night-inverted #dateLabel,
    body.night-mode.night-inverted #remainingPercent,
    body.night-mode.night-inverted .remaining-labels,
    body.night-mode.night-inverted .icon-button,
    body.night-mode.night-inverted .designer-credit {
      text-shadow: none;
    }

    body.night-mode.night-inverted .remaining-fill,
    body.night-mode.night-inverted .remaining-track {
      box-shadow: none;
    }

    body.night-mode.night-inverted main {
      background: var(--bg);
    }

    /* Final night override so the 22:00–07:59 red theme wins over sleep mode */
    body.night-mode,
    body.night-mode.tomorrow-mode {
      background: var(--bg);
      color: var(--fg);
    }

    body.night-mode.tomorrow-mode #minutes {
      color: var(--fg);
    }

    body.night-mode.tomorrow-mode .label,
    body.night-mode.tomorrow-mode #remainingPercent,
    body.night-mode.tomorrow-mode .remaining-labels,
    body.night-mode.tomorrow-mode .designer-credit {
      color: var(--muted);
    }

    body.night-mode.tomorrow-mode #dateLabel {
      color: var(--yellow);
    }

    body.night-mode.tomorrow-mode #clock {
      color: var(--mint);
    }

    body.night-mode.tomorrow-mode .remaining-fill {
      background: var(--orange) !important;
    }


    /* Final override: no black glow in inverted red/black night mode */
    body.night-mode.night-inverted #minutes,
    body.night-mode.night-inverted .label,
    body.night-mode.night-inverted #clock,
    body.night-mode.night-inverted #dateLabel,
    body.night-mode.night-inverted #remainingPercent,
    body.night-mode.night-inverted .remaining-labels,
    body.night-mode.night-inverted .icon-button,
    body.night-mode.night-inverted .designer-credit {
      text-shadow: none !important;
    }

    body.night-mode.night-inverted .remaining-fill,
    body.night-mode.night-inverted .remaining-track {
      box-shadow: none !important;
    }

    body.night-mode.night-inverted main {
      background: var(--bg) !important;
    }

    /* Large readable fullscreen display */
    main:fullscreen {
      width: 100vw;
      height: 100dvh;
      max-height: none;
      aspect-ratio: auto;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      padding: max(28px, env(safe-area-inset-top)) max(52px, env(safe-area-inset-right)) max(36px, env(safe-area-inset-bottom)) max(52px, env(safe-area-inset-left));
      grid-template-rows: auto 1fr auto;
      gap: clamp(24px, 3.4vw, 44px);
    }

    main:fullscreen #minutes {
      font-size: clamp(230px, 38vw, 560px);
      line-height: 0.68;
      letter-spacing: -0.09em;
    }

    main:fullscreen .label {
      font-size: clamp(36px, 5.4vw, 82px);
      letter-spacing: 0.035em;
      opacity: 0.78;
    }

    main:fullscreen .countdown {
      gap: clamp(22px, 3.6vw, 42px);
    }

    main:fullscreen .remaining-section {
      width: min(78vw, 980px);
      gap: 10px;
    }

    main:fullscreen .remaining-labels {
      font-size: clamp(14px, 1.8vw, 22px);
    }

    main:fullscreen .remaining-track {
      height: 6px;
    }

    main:-webkit-full-screen {
      width: 100vw;
      height: 100dvh;
      max-height: none;
      aspect-ratio: auto;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      padding: max(28px, env(safe-area-inset-top)) max(52px, env(safe-area-inset-right)) max(36px, env(safe-area-inset-bottom)) max(52px, env(safe-area-inset-left));
      grid-template-rows: auto 1fr auto;
      gap: clamp(24px, 3.4vw, 44px);
    }

    main:-webkit-full-screen #minutes {
      font-size: clamp(230px, 38vw, 560px);
      line-height: 0.68;
      letter-spacing: -0.09em;
    }

    main:-webkit-full-screen .label {
      font-size: clamp(36px, 5.4vw, 82px);
      letter-spacing: 0.035em;
      opacity: 0.78;
    }

    main:-webkit-full-screen .countdown {
      gap: clamp(22px, 3.6vw, 42px);
    }

    main:-webkit-full-screen .remaining-section {
      width: min(78vw, 980px);
      gap: 10px;
    }

    main:-webkit-full-screen .remaining-labels {
      font-size: clamp(14px, 1.8vw, 22px);
    }

    main:-webkit-full-screen .remaining-track {
      height: 6px;
    }

    
    main:fullscreen .remaining-fill,
    main:-webkit-full-screen .remaining-fill {
      border-radius: 999px;
    }

    


    /* Larger tap/click area for display mode toggle in fullscreen */
    main:fullscreen #numberHitArea,
    main:-webkit-full-screen #numberHitArea,
    body.fake-fullscreen #numberHitArea {
      width: min(92vw, 980px);
      height: clamp(260px, 48vw, 560px);
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
    }

    @media (orientation: landscape) and (max-height: 900px) {
      main:fullscreen #numberHitArea,
      main:-webkit-full-screen #numberHitArea,
      body.fake-fullscreen #numberHitArea {
        width: min(88vw, 900px);
        height: clamp(220px, 42vw, 440px);
        transform: translate(-50%, -50%);
      }
    }

    /* Better fullscreen date/time positioning */
    main:fullscreen .top,
    main:-webkit-full-screen .top,
    body.fake-fullscreen .top {
      width: 100%;
      padding: 0 clamp(2px, 1.2vw, 18px);
      font-size: clamp(13px, 1.35vw, 20px);
      letter-spacing: 0.18em;
      opacity: 0.88;
      align-items: flex-start;
    }

    main:fullscreen #dateLabel,
    main:-webkit-full-screen #dateLabel,
    body.fake-fullscreen #dateLabel {
      text-align: left;
      color: var(--yellow);
      color: color-mix(in srgb, var(--yellow) 78%, var(--fg) 22%);
    }

    main:fullscreen #clock,
    main:-webkit-full-screen #clock,
    body.fake-fullscreen #clock {
      text-align: right;
      color: var(--mint);
      color: color-mix(in srgb, var(--mint) 78%, var(--fg) 22%);
    }

    /* Raise lower progress section in fullscreen for better visual balance */
    main:fullscreen .remaining-section,
    main:-webkit-full-screen .remaining-section,
    body.fake-fullscreen .remaining-section {
      transform: translateY(-36px);
    }

    @media (orientation: landscape) and (max-height: 900px) {
      main:fullscreen #minutes,
      main:-webkit-full-screen #minutes {
        font-size: clamp(210px, 34vw, 460px);
      }

      main:fullscreen .label,
      main:-webkit-full-screen .label {
        font-size: clamp(30px, 4.4vw, 64px);
      }
    }

@media (max-width: 520px) {
      main {
        border-radius: 26px;
      }

  
    #numberHitArea {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -58%);
      width: min(78vw, 520px);
      height: clamp(130px, 28vw, 260px);
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0;
      cursor: pointer;
      z-index: 4;
      appearance: none;
      -webkit-appearance: none;
    }

    #numberHitArea:focus-visible {
      outline: 1px solid var(--fg);
      outline-offset: 6px;
      border-radius: 18px;
    }

    .remaining-section {
        width: min(88%, 390px);
      }
    }
  
    /* Final fullscreen hit-area override */
    main:fullscreen #numberHitArea,
    main:-webkit-full-screen #numberHitArea,
    body.fake-fullscreen #numberHitArea {
      width: min(92vw, 980px);
      height: clamp(260px, 48vw, 560px);
      top: 50%;
      transform: translate(-50%, -50%);
    }


  
    /* iPhone-only app fullscreen fallback; iPad keeps real browser fullscreen */
    html.iphone-app-fullscreen,
    html.iphone-app-fullscreen body,
    body.iphone-app-fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      min-height: 100vh !important;
      min-height: 100dvh !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: var(--bg) !important;
    }

    body.iphone-app-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      display: block !important;
      place-items: unset !important;
    }

    body.iphone-app-fullscreen main {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      min-height: 100vh !important;
      min-height: 100dvh !important;
      max-height: none !important;
      aspect-ratio: auto !important;
      border: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      margin: 0 !important;
      padding: max(28px, env(safe-area-inset-top)) max(26px, env(safe-area-inset-right)) max(34px, env(safe-area-inset-bottom)) max(26px, env(safe-area-inset-left)) !important;
      display: grid !important;
      grid-template-rows: auto 1fr auto !important;
      gap: clamp(24px, 3.4vw, 44px) !important;
      background: var(--bg) !important;
    }

    body.iphone-app-fullscreen .fullscreen-enter {
      display: none !important;
    }

    body.iphone-app-fullscreen .fullscreen-exit {
      display: block !important;
    }

    body.iphone-app-fullscreen #minutes {
      font-size: clamp(158px, 42vw, 520px) !important;
      line-height: 0.70 !important;
      letter-spacing: -0.09em !important;
    }

    body.iphone-app-fullscreen .label {
      font-size: clamp(26px, 6.5vw, 76px) !important;
      letter-spacing: 0.035em !important;
      opacity: 0.78 !important;
    }

    body.iphone-app-fullscreen .top {

    body.iphone-app-fullscreen .countdown {

    body.iphone-app-fullscreen .remaining-section {

    }

    body.iphone-app-fullscreen .remaining-labels {

    body.iphone-app-fullscreen .designer-credit {

    body.iphone-app-fullscreen #numberHitArea {

    @media (orientation: landscape) {
      body.iphone-app-fullscreen main {
        padding:
          max(18px, env(safe-area-inset-top))
          max(38px, env(safe-area-inset-right))

        grid-template-rows: auto minmax(0, 1fr) auto !important;

      body.iphone-app-fullscreen #minutes {

      }

      body.iphone-app-fullscreen .remaining-section {

      }

      body.iphone-app-fullscreen #numberHitArea {
        width: min(74vw, 740px) !important;
        height: clamp(150px, 34vw, 320px) !important;
        transform: translate(-50%, -52%) !important;
      }

      body.iphone-app-fullscreen .designer-credit {
        bottom: max(6px, env(safe-area-inset-bottom)) !important;
        font-size: clamp(8px, 1.2vw, 11px) !important;
      }
    }




  
    /* iPhone fullscreen button and spacing cleanup */
    body.iphone-app-fullscreen .settings {
      gap: 10px !important;
      top: max(14px, env(safe-area-inset-top)) !important;
      z-index: 50 !important;
    }

    body.iphone-app-fullscreen .icon-button {
      width: 34px !important;
      height: 34px !important;
      min-width: 34px !important;
      min-height: 34px !important;
      max-width: 34px !important;
      max-height: 34px !important;
      aspect-ratio: 1 / 1 !important;
      border-radius: 50% !important;
      flex: 0 0 34px !important;
      padding: 0 !important;
    }

    body.iphone-app-fullscreen .theme-dot {
      width: 13px !important;
      height: 13px !important;
      min-width: 13px !important;
      min-height: 13px !important;
      max-width: 13px !important;
      max-height: 13px !important;
      border-radius: 50% !important;
      flex: 0 0 13px !important;
    }

    body.iphone-app-fullscreen .fullscreen-button svg {
      width: 16px !important;
      height: 16px !important;
      flex: 0 0 16px !important;
    }

    body.iphone-app-fullscreen .remaining-section {
      z-index: 10 !important;
    }


    /* Strict number-only tap area: prevents edge/top-button activation */
    #numberHitArea {
      width: min(56vw, 360px) !important;
      height: clamp(86px, 18vw, 170px) !important;
      left: 50% !important;
      top: 50% !important;
      transform: translate(-50%, -58%) !important;
      z-index: 1 !important;
    }

    .settings {
      z-index: 50 !important;
    }

    .top,
    .remaining-section,
    .designer-credit {
      position: relative;
      z-index: 10;
    }

    .countdown {
      z-index: 2;
    }

    #minutes,
    #mainLabel {
      position: relative;
      z-index: 3;
      pointer-events: none;
    }

    /* Normal iPhone landscape: very tight tap area around number only */
    @media (orientation: landscape) and (max-height: 520px) and (max-width: 950px) {
      body:not(.iphone-app-fullscreen) #numberHitArea {
        width: min(34vw, 250px) !important;
        height: clamp(58px, 13vw, 118px) !important;
        top: 50% !important;
        transform: translate(-50%, -60%) !important;
        z-index: 1 !important;
      }
    }

    /* iPhone app fullscreen landscape: still centered, but not page-wide */
    @media (orientation: landscape) {
      body.iphone-app-fullscreen #numberHitArea {
        width: min(44vw, 420px) !important;
        height: clamp(84px, 18vw, 180px) !important;
        top: 50% !important;
        transform: translate(-50%, -56%) !important;
        z-index: 1 !important;
      }
    }


  
    /* Keep designer credit centered below the bar on iPad / real fullscreen */
    main:fullscreen .designer-credit,
    main:-webkit-full-screen .designer-credit {
      position: absolute !important;
      left: 50% !important;
      right: auto !important;
      transform: translateX(-50%) !important;
      bottom: max(10px, env(safe-area-inset-bottom)) !important;
      text-align: center !important;
      width: max-content !important;
      max-width: 90vw !important;
      white-space: nowrap !important;
    }

    /* In iPhone app fullscreen it also stays centered, not edge-aligned */
    body.iphone-app-fullscreen .designer-credit {
      position: absolute !important;
      left: 50% !important;
      right: auto !important;
      transform: translateX(-50%) !important;
      text-align: center !important;
      width: max-content !important;
      max-width: 90vw !important;
      white-space: nowrap !important;
    }


  
    /* Normal mode designer credit: centered below bar with balanced spacing */
    body:not(.iphone-app-fullscreen) main:not(:fullscreen):not(:-webkit-full-screen) .designer-credit {
      position: absolute !important;
      left: 50% !important;
      right: auto !important;
      bottom: clamp(8px, 1.65vw, 16px) !important;
      transform: translateX(-50%) !important;
      width: max-content !important;
      max-width: 90% !important;
      text-align: center !important;
      white-space: nowrap !important;
    }

    @media (max-width: 520px) {
      body:not(.iphone-app-fullscreen) main:not(:fullscreen):not(:-webkit-full-screen) .designer-credit {
        bottom: 7px !important;
        font-size: 8px !important;
      }
    }


  
    /* Fullscreen date/time refinement: larger, lower, more inward */
    main:fullscreen .top,
    main:-webkit-full-screen .top {
      padding: clamp(18px, 2.2vw, 34px) clamp(26px, 3.2vw, 58px) 0 !important;
      font-size: clamp(16px, 1.75vw, 26px) !important;
      letter-spacing: 0.18em !important;
      opacity: 0.94 !important;
      align-items: flex-start !important;
    }

    main:fullscreen #dateLabel,
    main:-webkit-full-screen #dateLabel {
      text-align: left !important;
    }

    main:fullscreen #clock,
    main:-webkit-full-screen #clock {
      text-align: right !important;
    }

    /* iPhone app fullscreen keeps its own tighter spacing */
    body.iphone-app-fullscreen .top {
      padding: 0 clamp(2px, 1.2vw, 18px) !important;
    }


  </style>
</head>
<body>
  <main aria-label="Minutes left today">
    <div class="settings" aria-label="Settings">
      <button id="toggleTheme" class="icon-button theme-button" type="button" aria-label="Toggle light and dark mode" title="Toggle theme">
        <span class="theme-dot" aria-hidden="true"></span>
      </button>
<button id="toggleFullscreen" class="icon-button fullscreen-button" type="button" aria-label="Enter fullscreen" title="Fullscreen">
        <svg class="fullscreen-enter" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
        </svg>
        <svg class="fullscreen-exit" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
        </svg>
      </button>
    </div>

    <div class="top">
      <div id="dateLabel">1 JUN</div>
      <div id="clock">--:--</div>
    </div>

    <section class="countdown">
      <div id="minutes">1440</div>
      <button id="numberHitArea" type="button" aria-label="Toggle between minutes and percent left today"></button>
      <div id="mainLabel" class="label">min</div>
    </section>

    <section class="remaining-section" aria-label="Remaining time from 8:00 to 24:00">
      <div class="remaining-labels">
        <span id="barStartLabel">8:00</span>
        <span id="remainingPercent">100%</span>
        <span id="barEndLabel">24:00</span>
      </div>
      <div class="remaining-track">
        <div id="remainingFill" class="remaining-fill"></div>
      </div>
    </section>

    <div class="designer-credit">Designed by Alex Weischer</div>
</main>

  <script>
    const minutesEl = document.getElementById("minutes");
    const mainLabelEl = document.getElementById("mainLabel");
    const numberHitAreaEl = document.getElementById("numberHitArea");
    const clockEl = document.getElementById("clock");
    const dateLabelEl = document.getElementById("dateLabel");
    const remainingFillEl = document.getElementById("remainingFill");
    const remainingPercentEl = document.getElementById("remainingPercent");
    const barStartLabelEl = document.getElementById("barStartLabel");
    const barEndLabelEl = document.getElementById("barEndLabel");
    const toggleTheme = document.getElementById("toggleTheme");
    const toggleFullscreen = document.getElementById("toggleFullscreen");
    const mainEl = document.querySelector("main");

    let lightMode = localStorage.getItem("dayLeftTheme") === "light";
    let nightInverted = localStorage.getItem("dayLeftNightTheme") === "inverted";
    let displayMode = localStorage.getItem("dayLeftDisplayMode") || "minutes";
    let animationId = null;

    function updateViewportHeight() {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty("--app-vh", `${vh}px`);
    }

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function formatDateShort(date) {
      const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
      return `${date.getDate()} ${months[date.getMonth()]}`;
    }

    function updateTheme() {
      const now = new Date();
      const isNight = now.getHours() < 8;

      document.body.classList.toggle("light", !isNight && lightMode);
      document.body.classList.toggle("night-mode", isNight);
      document.body.classList.toggle("night-inverted", isNight && nightInverted);

      if (isNight) {
        toggleTheme.title = nightInverted ? "Black red theme" : "Red black theme";
        toggleTheme.setAttribute("aria-label", nightInverted ? "Switch to black red theme" : "Switch to red black theme");
        localStorage.setItem("dayLeftNightTheme", nightInverted ? "inverted" : "default");
      } else {
        toggleTheme.title = lightMode ? "Dark mode" : "Light mode";
        toggleTheme.setAttribute("aria-label", lightMode ? "Switch to dark mode" : "Switch to light mode");
        localStorage.setItem("dayLeftTheme", lightMode ? "light" : "dark");
      }
    }

    function getState(now) {
      const hour = now.getHours();
      const minute = now.getMinutes();

      // Sleep mode: between 00:00 and 07:59, show minutes remaining until 8:00.
      const sleepMode = hour < 8;
      const nightMode = hour < 8;

      const end = new Date(now);
      end.setHours(24, 0, 0, 0);

      const wakeStart = new Date(now);
      wakeStart.setHours(8, 0, 0, 0);

      const midnightStart = new Date(now);
      midnightStart.setHours(0, 0, 0, 0);

      const remainingUntilMidnightMs = Math.max(0, end.getTime() - now.getTime());
      const remainingUntilWakeMs = Math.max(0, wakeStart.getTime() - now.getTime());

      const minutesLeft = sleepMode
        ? Math.max(0, Math.ceil(remainingUntilWakeMs / 60000))
        : Math.max(0, Math.ceil(remainingUntilMidnightMs / 60000));

      const dayWindowMs = end.getTime() - wakeStart.getTime();
      const dayRemainingMs = Math.max(0, end.getTime() - Math.max(now.getTime(), wakeStart.getTime()));
      const dayRemainingPercent = Math.min(100, Math.max(0, (dayRemainingMs / dayWindowMs) * 100));

      const sleepWindowMs = wakeStart.getTime() - midnightStart.getTime();
      const sleepElapsedMs = Math.max(0, Math.min(now.getTime(), wakeStart.getTime()) - midnightStart.getTime());
      const sleepProgressPercent = Math.min(100, Math.max(0, (sleepElapsedMs / sleepWindowMs) * 100));

      const displayPercent = sleepMode
        ? Math.round(100 - sleepProgressPercent)
        : Math.round(dayRemainingPercent);

      return {
        minutesLeft,
        dayRemainingPercent,
        sleepProgressPercent,
        displayPercent,
        sleepMode,
        nightMode,
        hour,
        minute
      };
    }

    function getTimeColor(minutesLeft) {
      if (minutesLeft >= 900) return "var(--time-1000)";
      if (minutesLeft >= 800) return "var(--time-900)";
      if (minutesLeft >= 700) return "var(--time-800)";
      if (minutesLeft >= 600) return "var(--time-700)";
      if (minutesLeft >= 500) return "var(--time-600)";
      if (minutesLeft >= 400) return "var(--time-500)";
      if (minutesLeft >= 300) return "var(--time-400)";
      if (minutesLeft >= 200) return "var(--time-300)";
      if (minutesLeft >= 100) return "var(--time-200)";
      if (minutesLeft >= 1) return "var(--time-100)";
      return "var(--time-0)";
    }

    function mixChannel(a, b, t) {
      return Math.round(a + (b - a) * t);
    }

    function mixRgb(from, to, t) {
      return `rgb(${mixChannel(from[0], to[0], t)}, ${mixChannel(from[1], to[1], t)}, ${mixChannel(from[2], to[2], t)})`;
    }

    function getSmoothPercentColor(percentLeft) {
      const p = Math.max(0, Math.min(100, percentLeft));

      const stops = [
        { p: 100, c: [76, 175, 80] },
        { p: 75, c: [168, 189, 61] },
        { p: 55, c: [217, 165, 46] },
        { p: 35, c: [217, 106, 34] },
        { p: 15, c: [204, 52, 40] },
        { p: 0, c: [185, 31, 31] }
      ];

      for (let i = 0; i < stops.length - 1; i++) {
        const high = stops[i];
        const low = stops[i + 1];

        if (p <= high.p && p >= low.p) {
          const t = (high.p - p) / (high.p - low.p);
          return mixRgb(high.c, low.c, t);
        }
      }

      return mixRgb(stops[stops.length - 1].c, stops[stops.length - 1].c, 0);
    }

    function render() {
      const now = new Date();
      const state = getState(now);

      updateTheme();
      document.body.classList.toggle("tomorrow-mode", state.sleepMode);

      const timeColor = getTimeColor(state.minutesLeft);

      if (displayMode === "percent") {
        const percentColor = getSmoothPercentColor(state.displayPercent);
        minutesEl.textContent = state.displayPercent;
        mainLabelEl.textContent = "%";
        minutesEl.style.color = state.nightMode ? "var(--fg)" : percentColor;
        remainingFillEl.style.background = state.nightMode ? "var(--orange)" : percentColor;
      } else {
        minutesEl.textContent = state.minutesLeft;
        mainLabelEl.textContent = "min";
        minutesEl.style.color = "";
        remainingFillEl.style.background = "var(--orange)";
      }

      dateLabelEl.textContent = formatDateShort(now);
      clockEl.textContent = `${pad(state.hour)}:${pad(state.minute)}`;

      if (state.sleepMode) {
        barStartLabelEl.textContent = "24:00";
        barEndLabelEl.textContent = "8:00";
        remainingFillEl.style.width = `${state.sleepProgressPercent}%`;
        remainingPercentEl.textContent = displayMode === "percent"
          ? `${state.minutesLeft} min`
          : `${Math.round(state.sleepProgressPercent)}%`;
      } else {
        barStartLabelEl.textContent = "8:00";
        barEndLabelEl.textContent = "24:00";
        remainingFillEl.style.width = `${state.dayRemainingPercent}%`;
        remainingPercentEl.textContent = displayMode === "percent"
          ? `${state.minutesLeft} min`
          : `${Math.round(state.dayRemainingPercent)}%`;
      }
    }

    function liveLoop() {
      render();
      animationId = window.requestAnimationFrame(liveLoop);
    }

    function startLiveLoop() {
      if (animationId) {
        window.cancelAnimationFrame(animationId);
      }
      render();
      animationId = window.requestAnimationFrame(liveLoop);
    }

    function isIPhoneOnlySafari() {
      const ua = navigator.userAgent;
      const isIPhone = /iPhone|iPod/.test(ua);
      const isWebKit = /WebKit/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
      return isIPhone && isWebKit;
    }

    function isIPhoneAppFullscreen() {
      return document.body.classList.contains("iphone-app-fullscreen");
    }

    function isFakeFullscreen() {
      return isIPhoneAppFullscreen();
    }

    function enterIPhoneAppFullscreen() {
      document.documentElement.classList.add("iphone-app-fullscreen");
      document.body.classList.add("iphone-app-fullscreen");
      document.documentElement.classList.remove("minute-app-fullscreen", "app-fullscreen", "fake-fullscreen-root");
      document.body.classList.remove("minute-app-fullscreen", "app-fullscreen", "fake-fullscreen");
      updateViewportHeight();
      window.scrollTo(0, 0);
      setFullscreenButtonState(true);
    }

    function exitIPhoneAppFullscreen() {
      document.documentElement.classList.remove("iphone-app-fullscreen", "minute-app-fullscreen", "app-fullscreen", "fake-fullscreen-root");
      document.body.classList.remove("iphone-app-fullscreen", "minute-app-fullscreen", "app-fullscreen", "fake-fullscreen");
      setFullscreenButtonState(false);
    }

    function setFullscreenButtonState(active) {
      toggleFullscreen.title = active ? "Exit fullscreen" : "Enter fullscreen";
      toggleFullscreen.setAttribute("aria-label", active ? "Exit fullscreen" : "Enter fullscreen");
    }

    async function toggleFullScreenMode() {
      try {
        /*
          iPhone Safari: use app-style fullscreen because true browser fullscreen
          is not available/reliable for normal webpages.
        */
        if (isIPhoneOnlySafari()) {
          if (isIPhoneAppFullscreen()) {
            exitIPhoneAppFullscreen();
          } else {
            enterIPhoneAppFullscreen();
          }
          return;
        }

        /*
          iPad Safari and desktop: keep using real Fullscreen API,
          so the Safari/address bars can disappear as before.
        */
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
          setFullscreenButtonState(false);
          return;
        }

        const target = document.querySelector("main");

        if (target.requestFullscreen) {
          await target.requestFullscreen();
          setFullscreenButtonState(true);
          return;
        }

        if (target.webkitRequestFullscreen) {
          target.webkitRequestFullscreen();
          setFullscreenButtonState(true);
          return;
        }

        enterIPhoneAppFullscreen();
      } catch (error) {
        enterIPhoneAppFullscreen();
      }
    }

    document.addEventListener("fullscreenchange", () => {
      setFullscreenButtonState(Boolean(document.fullscreenElement) || isIPhoneAppFullscreen());
    });

    document.addEventListener("webkitfullscreenchange", () => {
      setFullscreenButtonState(Boolean(document.webkitFullscreenElement) || isIPhoneAppFullscreen());
    });

    function toggleDisplayMode() {
      displayMode = displayMode === "minutes" ? "percent" : "minutes";
      localStorage.setItem("dayLeftDisplayMode", displayMode);
      render();
    }

    numberHitAreaEl.addEventListener("click", toggleDisplayMode);
    numberHitAreaEl.addEventListener("touchend", function (event) {
      event.preventDefault();
      toggleDisplayMode();
    }, { passive: false });

    toggleTheme.addEventListener("click", (event) => {
      event.stopPropagation();
      const now = new Date();
      const isNight = now.getHours() < 8;

      if (isNight) {
        nightInverted = !nightInverted;
      } else {
        lightMode = !lightMode;
      }

      updateTheme();
      render();
      showControlsBriefly();
    });

    toggleFullscreen.addEventListener("click", (event) => {
      event.stopPropagation();
      toggleFullScreenMode();
      showControlsBriefly();
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) startLiveLoop();
    });

    window.addEventListener("focus", startLiveLoop);
    window.addEventListener("pageshow", startLiveLoop);
    window.addEventListener("resize", updateViewportHeight);
    window.addEventListener("orientationchange", () => {
      updateViewportHeight();
      setTimeout(updateViewportHeight, 250);
    });

    let controlsTimer = null;

    function setControlsVisible(visible) {
      const settings = document.querySelector(".settings");
      settings.classList.toggle("is-visible", visible);
      mainEl.classList.toggle("controls-visible", visible);
    }

    function showControlsBriefly() {
      setControlsVisible(true);
      clearTimeout(controlsTimer);
      controlsTimer = setTimeout(() => {
        setControlsVisible(false);
      }, 2200);
    }

    window.addEventListener("mousemove", showControlsBriefly);
    window.addEventListener("mousedown", showControlsBriefly);
    window.addEventListener("touchstart", showControlsBriefly, { passive: true });
    window.addEventListener("keydown", showControlsBriefly);

    updateViewportHeight();
    updateTheme();
    startLiveLoop();
  </script>
</body>
</html>
