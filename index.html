<!doctype html>
<html lang="en">
<head>
  <!-- app-version: battery-iphone-no-block-modes | based on battery-iphone-fixed -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Day Left" />
  <title>Day Left</title>
  <style>
    :root {
      /* Default: RAL 9002 Grauweiß background, RAL 9005 Schwarz digits */
      --bg: #D7D5CB;
      --fg: #0A0A0A;
      --muted: rgba(10, 10, 10, 0.56);
      --line: rgba(10, 10, 10, 0.16);
      --track: rgba(10, 10, 10, 0.10);
      --orange: #0A0A0A;
      --yellow: #202020;
      --mint: #202020;
      --danger-bg: #D7D5CB;
      --danger-fg: #0A0A0A;
      --danger-muted: rgba(10, 10, 10, 0.56);
      --danger-line: rgba(10, 10, 10, 0.16);
      --danger-red: #0A0A0A;
      --danger-track: rgba(10, 10, 10, 0.10);
      --time-1000: #273b25;
      --time-900: #3d4a24;
      --time-800: #5a5523;
      --time-700: #705b22;
      --time-600: #845521;
      --time-500: #934920;
      --time-400: #973b22;
      --time-300: #8f2f24;
      --time-200: #782626;
      --time-100: #5c2022;
      --time-0: #3f191c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    main {
      width: min(94vw, 760px);
      aspect-ratio: 1 / 1;
      max-height: 94dvh;
      border: 1px solid var(--line);
      border-radius: 34px;
      padding: clamp(24px, 4.8vw, 46px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(20px, 3vw, 34px);
      position: relative;
      background: var(--bg);
      color: var(--fg);
      box-shadow: 0 18px 60px rgba(0,0,0,0.24);
    }

    .settings {
      position: absolute;
      left: 50%;
      top: clamp(18px, 4vw, 34px);
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    main:hover .settings,
    main:focus-within .settings,
    .settings.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .icon-button {
      appearance: none;
      -webkit-appearance: none;
      width: 34px;
      height: 34px;
      min-width: 34px;
      min-height: 34px;
      border: 1px solid var(--line);
      color: var(--fg);
      background: transparent;
      border-radius: 50%;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-sizing: border-box;
    }



    .theme-button,
    .fullscreen-button,
    .sound-button {
      position: relative;
      z-index: 301;
      flex: 0 0 34px;
      overflow: visible;
    }

    .theme-button::before,
    .fullscreen-button::before,
    .sound-button::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 999px;
    }

    .theme-button > *,
    .fullscreen-button > *,
    .sound-button > * {
      position: relative;
      z-index: 1;
      pointer-events: none;
    }

    .theme-dot {
      width: 13px;
      height: 13px;
      min-width: 13px;
      min-height: 13px;
      max-width: 13px;
      max-height: 13px;
      display: block;
      background: var(--fg);
      border-radius: 50%;
      flex: 0 0 13px;
      box-sizing: border-box;
    }
.fullscreen-button svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fullscreen-exit {
      display: none;
    }

    .sound-icon {
      width: 18px;
      height: 18px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      overflow: visible;
      transform: translateX(0);
    }

    .sound-on {
      display: none;
    }

    body.sound-enabled .sound-on {
      display: block;
    }

    body.sound-enabled .sound-off {
      display: none;
    }

    .sound-button svg {
      flex: 0 0 auto;
    }



    :fullscreen .fullscreen-enter {
      display: none;
    }

    :fullscreen .fullscreen-exit {
      display: block;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      color: var(--muted);
      font-size: clamp(10px, 1.8vw, 13px);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
      position: relative;
      z-index: 120;
    }

    #clock {
      color: var(--mint);
    }

    #dateLabel {
      color: var(--yellow);
      cursor: pointer;
      border-radius: 999px;
      position: relative;
      z-index: 42;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      text-transform: uppercase;
    }

    #dateLabel::before {
      content: "";
      position: absolute;
      left: -14px;
      right: -14px;
      top: -12px;
      bottom: -12px;
      border-radius: 999px;
    }

    #dateLabel:focus-visible {
      outline: 1px solid var(--muted);
      outline-offset: 5px;
    }

    .calendar-popover {
      position: absolute;
      left: clamp(24px, 4.8vw, 46px);
      top: clamp(52px, 7.4vw, 68px);
      width: min(58vw, 226px);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--bg);
      background: color-mix(in srgb, var(--bg) 94%, transparent);
      color: var(--fg);
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 10px;
      z-index: 260;
      opacity: 0;
      transform: translateY(-5px) scale(0.985);
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
      text-transform: lowercase;
      letter-spacing: 0.025em;
      font-variant-numeric: tabular-nums;
    }

    main.calendar-open .calendar-popover {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .calendar-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
      color: var(--fg);
    }

    .calendar-month {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.075em;
    }

    .calendar-today-label {
      font-size: 8px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      align-items: center;
    }

    .calendar-weekday,
    .calendar-day {
      min-height: 18px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      font-size: 8.5px;
      line-height: 1;
      white-space: nowrap;
    }

    .calendar-weekday {
      color: var(--muted);
      opacity: 0.72;
      letter-spacing: 0.10em;
    }

    .calendar-day {
      color: var(--fg);
      opacity: 0.74;
    }

    .calendar-day.is-today {
      color: var(--bg);
      background: var(--fg);
      opacity: 1;
      font-weight: 600;
    }

    .calendar-day.is-empty {
      opacity: 0;
    }

    body.theme-nightlight .calendar-day.is-today {
      background: var(--fg);
      color: var(--bg);
      box-shadow: 0 0 10px rgba(180, 48, 44, 0.22);
    }

    .countdown {
      text-align: center;
      transition: color 240ms ease;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: clamp(10px, 2vw, 18px);
      min-height: 0;
      position: relative;
    }
#minutes {
      font-size: clamp(108px, 24vw, 220px);
      font-weight: 500;
      line-height: 0.80;
      letter-spacing: -0.065em;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }


    #circleGrid {
      width: min(76vw, 540px);
      max-height: clamp(180px, 34vw, 310px);
      display: none;
      grid-template-columns: repeat(36, minmax(0, 1fr));
      gap: clamp(5px, 0.85vw, 9px);
      align-content: center;
      justify-content: center;
      overflow: hidden;
      padding: clamp(6px, 1vw, 12px);
    }


    #glassVisual {
      width: clamp(112px, 21vw, 176px);
      height: clamp(184px, 32vw, 276px);
      display: none;
      position: relative;
      border: 2px solid color-mix(in srgb, var(--fg) 58%, transparent);
      border-radius: 26px;
      overflow: visible;
      background:
        linear-gradient(to top,
          color-mix(in srgb, var(--bg) 89%, var(--fg) 11%) 0%,
          color-mix(in srgb, var(--bg) 96%, var(--fg) 4%) 100%);
      box-shadow:
        inset 0 0 0 1px color-mix(in srgb, var(--fg) 10%, transparent),
        0 10px 24px rgba(0, 0, 0, 0.10);
    }

    #glassVisual::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -16px;
      width: 42%;
      height: 14px;
      transform: translateX(-50%);
      border: 2px solid color-mix(in srgb, var(--fg) 54%, transparent);
      border-bottom: 0;
      border-radius: 12px 12px 0 0;
      background: color-mix(in srgb, var(--bg) 96%, var(--fg) 4%);
      pointer-events: none;
      z-index: 3;
    }

    #glassVisual::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 18px;
      border: 1px solid color-mix(in srgb, var(--fg) 18%, transparent);
      pointer-events: none;
      z-index: 5;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bg) 70%, transparent);
    }

    .glass-fill {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      height: 100%;
      max-height: calc(100% - 20px);
      border-radius: 16px;
      background: var(--glass-color, #2FA84F);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, white 20%, transparent);
      transition: height 0.25s linear, background 90ms ease;
      z-index: 2;
    }

    .glass-fill::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        linear-gradient(to bottom,
          rgba(255,255,255,0.16),
          rgba(255,255,255,0.00) 34%,
          rgba(0,0,0,0.08) 100%);
      pointer-events: none;
    }

    .glass-shine {
      position: absolute;
      top: 14px;
      bottom: 14px;
      left: 16px;
      width: 5px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--fg) 18%, transparent);
      opacity: 0.32;
      z-index: 6;
      pointer-events: none;
    }

    body.glass-mode #minutes,
    body.glass-mode #circleGrid {
      display: none;
    }

    body.glass-mode #glassVisual {
      display: block;
    }

    main:fullscreen #glassVisual,
    main:-webkit-full-screen #glassVisual {
      width: clamp(170px, 16vw, 260px);
      height: clamp(280px, 27vw, 420px);
      border-radius: 34px;
    }

    main:fullscreen #glassVisual::before,
    main:-webkit-full-screen #glassVisual::before {
      top: -20px;
      height: 18px;
      border-radius: 14px 14px 0 0;
    }

    main:fullscreen .glass-fill,
    main:-webkit-full-screen .glass-fill {
      left: 12px;
      right: 12px;
      bottom: 12px;
      max-height: calc(100% - 24px);
      border-radius: 22px;
    }

    @media (orientation: landscape) and (min-width: 900px) and (max-width: 1400px) and (max-height: 1100px) {
      main:fullscreen #glassVisual,
      main:-webkit-full-screen #glassVisual,
      body.fake-fullscreen main #glassVisual {
        width: clamp(138px, 12vw, 196px);
        height: clamp(226px, 22vw, 326px);
        border-radius: 28px;
      }
    }

    .minute-dot {
      width: clamp(3.5px, 0.62vw, 6px);
      height: clamp(3.5px, 0.62vw, 6px);
      border-radius: 50%;
      background: currentColor;
      opacity: 0.48;
      justify-self: center;
      align-self: center;
    }

    .minute-dot:nth-child(5n) {
      opacity: 0.62;
    }

    .minute-dot:nth-child(15n) {
      opacity: 0.78;
    }

    body.circles-mode #minutes {
      display: none;
    }

    body.circles-mode #circleGrid {
      display: grid;
      color: var(--fg);
    }

    .label {
      color: var(--fg);
      font-size: clamp(13px, 2.4vw, 20px);
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      opacity: 0.70;
    }


    #numberHitArea {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -58%);
      width: min(78vw, 520px);
      height: clamp(130px, 28vw, 260px);
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0;
      cursor: pointer;
      z-index: 4;
      appearance: none;
      -webkit-appearance: none;
    }

    #numberHitArea:focus-visible {
      outline: 1px solid var(--fg);
      outline-offset: 6px;
      border-radius: 18px;
    }


    .designer-credit {
      position: absolute;
      left: 50%;
      bottom: clamp(14px, 2.6vw, 22px);
      transform: translateX(-50%);
      color: var(--muted);
      opacity: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      font-size: clamp(8px, 1.35vw, 10px);
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: none;
      white-space: nowrap;
      transition: opacity 0.18s ease;
      z-index: 2;
    }

    main.controls-visible .designer-credit,
    main:focus-within .designer-credit,
    .settings.is-visible ~ .designer-credit {
      opacity: 0.22;
    }

    main:fullscreen .designer-credit,
    main:-webkit-full-screen .designer-credit,
    body.fake-fullscreen .designer-credit {
      bottom: max(18px, env(safe-area-inset-bottom));
      font-size: clamp(9px, 1.15vw, 13px);
    }

    .remaining-section {
      width: min(76%, 540px);
      justify-self: center;
      align-self: end;
      display: grid;
      gap: 8px;
      position: relative;
      z-index: 30;
    }

    .remaining-labels {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      align-items: center;
      color: var(--muted);
      font-size: clamp(9px, 1.5vw, 11px);
      letter-spacing: 0.09em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }

    .remaining-labels span:nth-child(2) {
      text-align: center;
    }

    #remainingPercent {
      color: var(--muted);
    }

    .remaining-labels span:nth-child(3) {
      text-align: right;
    }

    .time-adjust {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .time-adjust.end {
      justify-self: end;
    }

    .time-arrow {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      width: 32px;
      height: 32px;
      margin-inline: -7px;
      border-radius: 999px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      font: inherit;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      position: relative;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, background 0.18s ease, color 0.18s ease;
    }

    main.controls-visible .time-arrow,
    main:focus-within .time-arrow {
      opacity: 1;
      pointer-events: auto;
    }

    .time-arrow::before {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 999px;
    }

    .time-arrow:hover,
    .time-arrow:focus-visible {
      color: var(--fg);
      background: color-mix(in srgb, var(--fg) 8%, transparent);
      outline: none;
    }


    #barStartLabel,
    #barEndLabel {
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
      position: relative;
      z-index: 20;
    }

    .remaining-track {
      position: relative;
      width: 100%;
      height: 6px;
      background:
        linear-gradient(180deg,
          color-mix(in srgb, var(--fg) 18%, var(--bg)) 0%,
          color-mix(in srgb, var(--fg) 10%, var(--bg)) 100%);
      border: 1px solid color-mix(in srgb, var(--fg) 34%, transparent);
      border-radius: 999px;
      overflow: hidden;
      display: block;
      box-shadow:
        inset 0 0 0 1px color-mix(in srgb, var(--bg) 62%, transparent),
        inset 0 1px 2px color-mix(in srgb, #000 18%, transparent),
        0 0 0 1px color-mix(in srgb, var(--fg) 7%, transparent);
    }

    .remaining-track::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(90deg,
        color-mix(in srgb, var(--fg) 10%, transparent),
        transparent 18%,
        transparent 82%,
        color-mix(in srgb, var(--bg) 18%, transparent));
      opacity: 0.42;
    }

    .remaining-fill {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: 100%;
      background: transparent;
      border-left: 1px solid color-mix(in srgb, var(--fg) 38%, transparent);
      border-radius: 999px;
      display: block;
      box-shadow:
        inset 0 1px 0 color-mix(in srgb, #fff 20%, transparent),
        inset 0 -1px 0 color-mix(in srgb, #000 16%, transparent),
        -1px 0 0 color-mix(in srgb, var(--bg) 42%, transparent);
      transition: width 0.25s linear, background 12ms cubic-bezier(0.12, 0.86, 0.14, 1);
    }

    .light {
      --bg: #f4f1ea;
      --fg: #111;
      --muted: rgba(17, 17, 17, 0.55);
      --line: rgba(17, 17, 17, 0.16);
      --track: rgba(17, 17, 17, 0.10);
      --yellow: #8c7a24;
      --mint: #3f827c;
      --danger-bg: #fff0ee;
      --danger-fg: #210504;
      --danger-muted: rgba(33, 5, 4, 0.56);
      --danger-line: rgba(185, 59, 53, 0.30);
      --danger-red: #b93b35;
      --danger-track: rgba(185, 59, 53, 0.14);
    }


    /* Reduced 3-theme system */
    body.theme-invert {
      --bg: #0A0A0A;
      --fg: #D7D5CB;
      --muted: rgba(215, 213, 203, 0.58);
      --line: rgba(215, 213, 203, 0.18);
      --track: rgba(215, 213, 203, 0.12);
      --orange: #D7D5CB;
      --yellow: #D7D5CB;
      --mint: #D7D5CB;
      --time-1000: #8ca37f;
      --time-900: #9ea378;
      --time-800: #b0a06f;
      --time-700: #bf9565;
      --time-600: #c88459;
      --time-500: #ca6f50;
      --time-400: #c45b49;
      --time-300: #b84843;
      --time-200: #a4393d;
      --time-100: #872f36;
      --time-0: #6c2830;
    }

    body.theme-night-red {
      /* Dim warm red on RAL 9005 black for night use. */
      --bg: #0A0A0A;
      --fg: #B7352D;
      --muted: rgba(183, 53, 45, 0.58);
      --line: rgba(183, 53, 45, 0.18);
      --track: rgba(183, 53, 45, 0.11);
      --orange: #B7352D;
      --yellow: #A93630;
      --mint: #A93630;
      --time-1000: #C95045;
      --time-900: #C54A40;
      --time-800: #BF443B;
      --time-700: #B93E36;
      --time-600: #B33831;
      --time-500: #AA332E;
      --time-400: #9E2F2B;
      --time-300: #902A28;
      --time-200: #802624;
      --time-100: #6E2221;
      --time-0: #5A1D1D;
    }

    body.theme-night-red #minutes,
    body.theme-night-red .label,
    body.theme-night-red #clock,
    body.theme-night-red #dateLabel,
    body.theme-night-red #remainingPercent,
    body.theme-night-red .remaining-labels,
    body.theme-night-red .icon-button,
    body.theme-night-red .designer-credit {
      color: var(--fg);
      text-shadow: none;
    }

    body.theme-night-red .remaining-fill {
      background: var(--fg) !important;
      box-shadow: none;
    }


    body.theme-midnight {
      --bg: #08111f;
      --fg: #dbe9ff;
      --muted: rgba(219, 233, 255, 0.56);
      --line: rgba(154, 190, 255, 0.20);
      --track: rgba(154, 190, 255, 0.13);
      --orange: #7aa2ff;
      --yellow: #a7b7ff;
      --mint: #77d6c7;
      --time-1000: #84dcc6;
      --time-900: #79d3d9;
      --time-800: #7aa2ff;
      --time-700: #8d8cff;
      --time-600: #a88cff;
      --time-500: #c38dff;
      --time-400: #d487e6;
      --time-300: #df7ebd;
      --time-200: #e07194;
      --time-100: #df6f76;
      --time-0: #d85c5c;
    }

    body.theme-sage {
      --bg: #101510;
      --fg: #edf4df;

    if (!Number.isInteger(dayStartMinutes) || dayStartMinutes < 0 || dayStartMinutes > 1410) {

    }

    if (!Number.isInteger(dayEndMinutes) || dayEndMinutes < 30 || dayEndMinutes > 1440) {
      dayEndMinutes = 24 * 60;
    }

    dayStartMinutes = Math.round(dayStartMinutes / 30) * 30;
    dayEndMinutes = Math.round(dayEndMinutes / 30) * 30;

      return `${date.getDate()} ${months[date.getMonth()]}`;
    }

    function formatCalendarDay(date) {
      const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
      return `${months[date.getMonth()]} ${date.getDate()}`;

      if (calendarOpen) {
        renderCalendar(new Date());
        showControlsBriefly();
      }

        event.preventDefault();
        event.stopPropagation();

      setCalendarOpen(!calendarOpen);

      if (!calendarGridEl) return;

      const monthsLong = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
      const weekdays = ["mo", "tu", "we", "th", "fr", "sa", "su"];
      const year = now.getFullYear();
      const month = now.getMonth();
      const first = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const mondayOffset = (first.getDay() + 6) % 7;

      calendarMonthEl.textContent = `${monthsLong[month]} ${year}`;
      calendarGridEl.innerHTML = "";

      const fragment = document.createDocumentFragment();

      weekdays.forEach((weekday) => {
        const el = document.createElement("div");
        el.className = "calendar-weekday";
        el.textContent = weekday;
        fragment.appendChild(el);
      });

      for (let i = 0; i < mondayOffset; i += 1) {
        const empty = document.createElement("div");
        empty.className = "calendar-day is-empty";
        empty.textContent = "·";
        fragment.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day += 1) {
        const date = new Date(year, month, day);
        const el = document.createElement("div");
        el.className = "calendar-day";
        el.textContent = String(day);

        if (day === now.getDate()) {
          el.classList.add("is-today");
        }

        fragment.appendChild(el);
      }

      calendarGridEl.appendChild(fragment);

    function updateTheme() {
      document.body.classList.remove(
        "light",
        "theme-invert",
        "theme-night-red",
        "theme-graphite",
        "theme-nightlight",
        "theme-ultramarine-orange",
        "theme-sand",
        "theme-forest-deep",
        "theme-sage",
        "theme-slate-water",
        "theme-midnight",
        "theme-lilac",
        "theme-sepia-ultramarine"
      );

      if (currentTheme === "invert") {
        document.body.classList.add("theme-invert");
      } else if (currentTheme === "night-red") {
        document.body.classList.add("theme-night-red");
      } else if (currentTheme === "sepia-ultramarine") {
        document.body.classList.add("theme-sepia-ultramarine");
      }

      const currentIndex = themeModes.indexOf(currentTheme);
      const nextTheme = themeModes[(currentIndex + 1) % themeModes.length];
      toggleTheme.title = themeNames[currentTheme];
      toggleTheme.setAttribute("aria-label", `Theme: ${themeNames[currentTheme]}. Switch to ${themeNames[nextTheme]}.`);
      localStorage.setItem("dayLeftTheme", currentTheme);
    }

    function cycleTheme() {
      const currentIndex = themeModes.indexOf(currentTheme);
      const previousTheme = currentTheme;
      currentTheme = themeModes[(currentIndex + 1) % themeModes.length];

      document.body.classList.remove("theme-red-bloom", "theme-transition-to-invert", "theme-transition-to-red");

      if (previousTheme === "default" && currentTheme === "invert") {
        document.body.classList.add("theme-transition-to-invert");
        window.setTimeout(() => {
          document.body.classList.remove("theme-transition-to-invert");
        }, 18);
      }

      if (currentTheme === "night-red" && previousTheme !== "night-red") {
        document.body.classList.add("theme-transition-to-red");
      }

      updateTheme();

      if (currentTheme === "night-red" && previousTheme !== "night-red") {
        void document.body.offsetWidth;
        document.body.classList.add("theme-red-bloom");
        window.setTimeout(() => {
          document.body.classList.remove("theme-red-bloom", "theme-transition-to-red");
        }, 18);
      }

      render();
      showControlsBriefly();
    }


    function ensureAudioContext() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;

      audioContext = audioContext || new AudioCtx();

      if (!masterGain) {
        masterGain = audioContext.createGain();
        masterGain.gain.value = 0.82;
        masterGain.connect(audioContext.destination);
      }

      return audioContext;
    }

    async function unlockSound() {
      try {
        const ctx = ensureAudioContext();
        if (!ctx) return false;

        if (ctx.state === "suspended") {
          await ctx.resume();
        }

        const now = ctx.currentTime;

        // Silent unlock only. The audible confirmation below uses the same
        // playDigitFlipTick() function as every visible digit change.
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, now);
        gain.gain.setValueAtTime(0.00001, now);
        gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.025);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now);
        osc.stop(now + 0.030);

        soundUnlocked = true;
        return true;
      } catch (error) {
        soundUnlocked = false;
        return false;
      }
    }

    function getSoundModeName(modeId) {
      const match = soundModes.find((mode) => mode.id === modeId);
      return match ? match.name : "Stumm";
    }

    function setSoundMode(modeId) {
      if (!soundModes.some((mode) => mode.id === modeId)) {
        modeId = "mute";
      }

      soundMode = modeId;
      soundEnabled = soundMode !== "mute";
      localStorage.setItem("dayLeftSoundMode", soundMode);
      document.body.classList.toggle("sound-enabled", soundEnabled);

      if (toggleSound) {
        const currentIndex = soundModes.findIndex((mode) => mode.id === soundMode);
        const nextMode = soundModes[(currentIndex + 1) % soundModes.length];
        const currentName = getSoundModeName(soundMode);
        toggleSound.title = soundEnabled ? currentName : "Sound off";
        toggleSound.setAttribute("aria-label", soundEnabled
          ? `Sound: ${currentName}. Weiter zu ${nextMode.name}.`
          : `Sound ist stumm. Weiter zu ${nextMode.name}.`);
      }
    }

    async function toggleTickSound(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      /*
        Reliable first-tap sound behavior:
        - If the app visually remembers Papierflip but the browser audio context is not unlocked yet,
          the first tap now unlocks audio and keeps Papierflip active instead of cycling back to mute.
        - If muted, the first tap switches directly to Papierflip, unlocks audio, and plays the sample.
        - If Papierflip is already unlocked, the next tap mutes as expected.
      */
      const currentlyAudible = soundMode !== "mute" && soundUnlocked;

      if (soundMode !== "mute" && !soundUnlocked) {
        const ok = await unlockSound();
        if (!ok) {
          setSoundMode("mute");
          showControlsBriefly();
          return;
        }

        setSoundMode(soundMode);
        lastVisibleNumberText = String(minutesEl.textContent || "");
        playDigitFlipTick(1.0);
        showControlsBriefly();
        return;
      }

      if (currentlyAudible) {
        setSoundMode("mute");
        showControlsBriefly();
        return;
      }

      const nextMode = soundModes.find((mode) => mode.id !== "mute") || soundModes[0];

      const ok = await unlockSound();
      if (!ok || nextMode.id === "mute") {
        setSoundMode("mute");
        showControlsBriefly();
        return;
      }

      setSoundMode(nextMode.id);
      lastVisibleNumberText = String(minutesEl.textContent || "");
      playDigitFlipTick(1.0);
      showControlsBriefly();
    }

    function makeNoiseBuffer(ctx, duration, decayPower = 8) {
      const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i += 1) {
        const t = i / bufferSize;
        const envelope = Math.pow(1 - t, decayPower);
        data[i] = (Math.random() * 2 - 1) * envelope;
      }

      return buffer;
    }

    function addNoiseHit(ctx, output, start, options) {
      const noise = ctx.createBufferSource();
      noise.buffer = makeNoiseBuffer(ctx, options.duration || 0.02, options.decay || 8);

      let node = noise;

      if (options.highpass) {
        const highpass = ctx.createBiquadFilter();
        highpass.type = "highpass";
        highpass.frequency.setValueAtTime(options.highpass, start);
        node.connect(highpass);
        node = highpass;
      }

      if (options.bandpass) {
        const bandpass = ctx.createBiquadFilter();
        bandpass.type = "bandpass";
        bandpass.frequency.setValueAtTime(options.bandpass, start);
        if (options.bandpassEnd) {
          bandpass.frequency.exponentialRampToValueAtTime(options.bandpassEnd, start + (options.duration || 0.02));
        }
        bandpass.Q.setValueAtTime(options.q || 2, start);
        node.connect(bandpass);
        node = bandpass;
      }

      if (options.lowpass) {
        const lowpass = ctx.createBiquadFilter();
        lowpass.type = "lowpass";
        lowpass.frequency.setValueAtTime(options.lowpass, start);
        node.connect(lowpass);
        node = lowpass;
      }

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.linearRampToValueAtTime(options.gain || 0.08, start + (options.attack || 0.0015));
      gain.gain.exponentialRampToValueAtTime(0.0001, start + (options.release || options.duration || 0.03));
      node.connect(gain);
      gain.connect(output);

      noise.start(start);
      noise.stop(start + (options.duration || 0.03) + 0.006);
    }

    function addToneHit(ctx, output, start, options) {
      const osc = ctx.createOscillator();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();

      osc.type = options.type || "sine";
      osc.frequency.setValueAtTime(options.freq || 900, start);
      if (options.endFreq) {
        osc.frequency.exponentialRampToValueAtTime(options.endFreq, start + (options.duration || 0.04));
      }

      filter.type = options.filterType || "bandpass";
      filter.frequency.setValueAtTime(options.filterFreq || options.freq || 900, start);
      filter.Q.setValueAtTime(options.q || 1.4, start);

      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.linearRampToValueAtTime(options.gain || 0.03, start + (options.attack || 0.004));
      gain.gain.exponentialRampToValueAtTime(0.0001, start + (options.release || options.duration || 0.05));

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(output);
      osc.start(start);
      osc.stop(start + (options.duration || 0.055) + 0.01);
    }

    function playDigitFlipTick(intensity = 0.78) {
      if (soundMode === "mute" || !soundUnlocked) return;

      try {
        const ctx = ensureAudioContext();
        if (!ctx) return;

        if (ctx.state === "suspended") {
          ctx.resume();
        }

        const start = ctx.currentTime;
        const output = ctx.createGain();
        output.gain.setValueAtTime(Math.max(0.45, intensity), start);
        output.connect(masterGain);

        if (soundMode === "paper") {
          addNoiseHit(ctx, output, start, {
            duration: 0.045,
            highpass: 900,
            bandpass: 2600,
            q: 0.9,
            gain: 0.070,
            decay: 3.5,
            release: 0.052
          });
          addNoiseHit(ctx, output, start + 0.022, {
            duration: 0.020,
            highpass: 1200,
            bandpass: 3200,
            q: 1.2,
            gain: 0.040,
            decay: 5.2,
            release: 0.035
          });
        }
      } catch (error) {
        // Sound is optional.
      }
    }

    function playTickOnVisibleNumberChange(nextText) {
      const value = String(nextText);

      if (lastVisibleNumberText === "") {
        lastVisibleNumberText = value;
        return;
      }

      if (value !== lastVisibleNumberText) {
        lastVisibleNumberText = value;
        playDigitFlipTick(0.78);
      }
    }

    function formatTimeLabel(totalMinutes) {
      const safeMinutes = Math.max(0, Math.min(1440, totalMinutes));
      if (safeMinutes === 1440) return "24:00";
      const hours = Math.floor(safeMinutes / 60);
      const minutes = safeMinutes % 60;
      return `${hours}:${pad(minutes)}`;
    }

    function minutesSinceMidnight(date) {
      return date.getHours() * 60 + date.getMinutes() + date.getSeconds() / 60 + date.getMilliseconds() / 60000;
    }

    function setClockFromMinutes(date, totalMinutes) {
      const clamped = Math.max(0, Math.min(1440, totalMinutes));
      if (clamped === 1440) {
        date.setHours(24, 0, 0, 0);
        return;
      }
      date.setHours(Math.floor(clamped / 60), clamped % 60, 0, 0);
    }

    function buildWindowForNow(now) {
      const startMinutes = dayStartMinutes;
      const endMinutes = dayEndMinutes;
      const nowMinutes = minutesSinceMidnight(now);
      const crossesMidnight = endMinutes <= startMinutes;

      const start = new Date(now);
      const end = new Date(now);

      if (!crossesMidnight) {
        setClockFromMinutes(start, dayStartMinutes);
        setClockFromMinutes(end, dayEndMinutes);

        if (nowMinutes < startMinutes) {
          return { start, end, active: false, nextStart: start };
        }

        if (nowMinutes >= endMinutes) {
          const nextStart = new Date(start);
          nextStart.setDate(nextStart.getDate() + 1);
          return { start, end, active: false, nextStart };
        }

        return { start, end, active: true, nextStart: start };
      }

      if (nowMinutes >= startMinutes) {
        setClockFromMinutes(start, dayStartMinutes);
        end.setDate(end.getDate() + 1);
        setClockFromMinutes(end, dayEndMinutes);
        return { start, end, active: true, nextStart: start };
      }

      if (nowMinutes < endMinutes) {
        start.setDate(start.getDate() - 1);
        setClockFromMinutes(start, dayStartMinutes);
        setClockFromMinutes(end, dayEndMinutes);
        return { start, end, active: true, nextStart: start };
      }

      setClockFromMinutes(start, dayStartMinutes);
      end.setDate(end.getDate() + 1);
      setClockFromMinutes(end, dayEndMinutes);
      return { start, end, active: false, nextStart: start };
    }

    function getState(now) {
      const hour = now.getHours();
      const minute = now.getMinutes();
      const currentWindow = buildWindowForNow(now);
      const activeMode = currentWindow.active;

      const fullWindowMs = Math.max(1, currentWindow.end.getTime() - currentWindow.start.getTime());
      const remainingInWindowMs = Math.max(0, currentWindow.end.getTime() - now.getTime());
      const elapsedInWindowMs = Math.min(fullWindowMs, Math.max(0, now.getTime() - currentWindow.start.getTime()));

      const remainingTargetMs = activeMode
        ? remainingInWindowMs
        : Math.max(0, currentWindow.nextStart.getTime() - now.getTime());

      const minutesLeft = Math.max(0, Math.ceil(remainingTargetMs / 60000));
      const secondsLeft = Math.max(0, Math.ceil(remainingTargetMs / 1000));

      const dayRemainingPercent = activeMode
        ? Math.min(100, Math.max(0, (remainingInWindowMs / fullWindowMs) * 100))
        : 100;

      let sleepProgressPercent = 0;
      if (!activeMode) {
        const previousEnd = new Date(currentWindow.nextStart);
        const endMinutes = dayEndHour * 60;
        const startMinutes = dayStartHour * 60;
        const crossesMidnight = endMinutes <= startMinutes;

        if (crossesMidnight) {
          previousEnd.setHours(dayEndHour, 0, 0, 0);
        } else {
          previousEnd.setDate(previousEnd.getDate() - 1);
          previousEnd.setHours(dayEndHour, 0, 0, 0);
        }

        const sleepWindowMs = Math.max(1, currentWindow.nextStart.getTime() - previousEnd.getTime());
        const sleepElapsedMs = Math.min(sleepWindowMs, Math.max(0, now.getTime() - previousEnd.getTime()));
        sleepProgressPercent = Math.min(100, Math.max(0, (sleepElapsedMs / sleepWindowMs) * 100));
      }

      const displayPercent = activeMode
        ? Math.round(dayRemainingPercent)
        : Math.round(100 - sleepProgressPercent);

      return {
        minutesLeft,
        secondsLeft,
        dayRemainingPercent,
        sleepProgressPercent,
        displayPercent,
        sleepMode: !activeMode,
        hour,
        minute
      };
    }

    function getTimeColor(minutesLeft) {
      // Fixed progress-bar scale, independent of the active theme:
      // clear green when much time is left, then yellow/orange, then red.
      if (minutesLeft >= 900) return "#2FA84F";
      if (minutesLeft >= 800) return "#4FB34B";
      if (minutesLeft >= 700) return "#7DBB3F";
      if (minutesLeft >= 600) return "#A9BE35";
      if (minutesLeft >= 500) return "#D0B533";
      if (minutesLeft >= 400) return "#E59B2E";
      if (minutesLeft >= 300) return "#E27727";
      if (minutesLeft >= 200) return "#D95328";
      if (minutesLeft >= 100) return "#CC382D";
      if (minutesLeft >= 1) return "#B9252B";
      return "#9D1B24";
    }

    function renderMinuteCircles(count) {
      if (!circleGridEl || lastCircleCount === count) return;

      lastCircleCount = count;
      circleGridEl.innerHTML = "";

      const fragment = document.createDocumentFragment();
      const safeCount = Math.max(0, Math.min(1440, count));

      for (let i = 0; i < safeCount; i += 1) {
        const dot = document.createElement("span");
        dot.className = "minute-dot";
        fragment.appendChild(dot);
      }

      circleGridEl.appendChild(fragment);
      circleGridEl.setAttribute("aria-label", `${safeCount} remaining minutes shown as circles`);
    }


    function ordinalFractionWord(denominator) {
      const words = {
        1: "whole",
        2: "half",
        3: "third",
        4: "fourth",
        5: "fifth",
        6: "sixth",
        7: "seventh",
        8: "eighth",
        9: "ninth",
        10: "tenth",
        11: "eleventh",
        12: "twelfth",
        13: "thirteenth",
        14: "fourteenth",
        15: "fifteenth",
        16: "sixteenth",
        17: "seventeenth",
        18: "eighteenth",
        19: "nineteenth",
        20: "twentieth",
        24: "twenty-fourth",
        30: "thirtieth",
        36: "thirty-sixth",
        48: "forty-eighth",
        60: "sixtieth"
      };
      return words[denominator] || `${denominator}th`;
    }

    function cardinalWord(number) {
      const words = {
        0: "zero",
        1: "one",
        2: "two",
        3: "three",
        4: "four",
        5: "five",
        6: "six",
        7: "seven",
        8: "eight",
        9: "nine",
        10: "ten",
        11: "eleven",
        12: "twelve",
        13: "thirteen",
        14: "fourteen",
        15: "fifteen",
        16: "sixteen",
        17: "seventeen",
        18: "eighteen",
        19: "nineteen",
        20: "twenty"
      };
      return words[number] || String(number);
    }

    function greatestCommonDivisor(a, b) {
      let x = Math.abs(a);
      let y = Math.abs(b);

      while (y) {
        const t = y;
        y = x % y;
        x = t;
      }

      return x || 1;
    }

    function getRemainingUnitFraction(state) {
      const percent = Math.max(0, Math.min(100, Math.round(state.displayPercent)));

      if (percent <= 0) {
        return { symbol: "0", words: "none" };
      }

      if (percent >= 100) {
        return { symbol: "1/1", words: "one whole" };
      }

      const divisor = greatestCommonDivisor(percent, 100);
      const numerator = percent / divisor;
      const denominator = 100 / divisor;
      const denominatorWord = ordinalFractionWord(denominator);
      const pluralSuffix = numerator === 1 ? "" : "s";

      return {
        symbol: `${numerator}/${denominator}`,
        words: `${cardinalWord(numerator)} ${denominatorWord}${pluralSuffix}`
      };
    }


    function render() {
      const now = new Date();
      const state = getState(now);

      document.body.classList.remove("circles-mode", "glass-mode");

      const timeColor = currentTheme === "night-red" ? "#B7352D" : getTimeColor(state.minutesLeft);

      let nextNumberText = "";

      if (displayMode === "blocks5") {
        nextNumberText = String(Math.ceil(state.minutesLeft / 5));
        mainLabelEl.textContent = "5 min";
        minutesEl.style.color = "";
        remainingFillEl.style.background = timeColor;
      } else if (displayMode === "blocks15") {
        nextNumberText = String(Math.ceil(state.minutesLeft / 15));
        mainLabelEl.textContent = "15 min";
        minutesEl.style.color = "";
        remainingFillEl.style.background = timeColor;
      } else if (displayMode === "blocks30") {
        nextNumberText = String(Math.ceil(state.minutesLeft / 30));
        mainLabelEl.textContent = "30 min";
        minutesEl.style.color = "";
        remainingFillEl.style.background = timeColor;
      } else if (displayMode === "hours") {
        nextNumberText = String(Math.ceil(state.minutesLeft / 60));
        mainLabelEl.textContent = "h";
        minutesEl.style.color = "";
        remainingFillEl.style.background = timeColor;
      } else if (displayMode === "percent") {
        nextNumberText = String(state.displayPercent);
        mainLabelEl.textContent = "%";
        minutesEl.style.color = timeColor;
        remainingFillEl.style.background = timeColor;
      } else if (displayMode === "glass") {
        const fillPercent = Math.max(0, Math.min(100, state.displayPercent));
        nextNumberText = String(fillPercent);
        document.body.classList.add("glass-mode");
        mainLabelEl.textContent = "battery";
        minutesEl.style.color = "";
        remainingFillEl.style.background = timeColor;
        if (glassFillEl) {
          glassFillEl.style.height = `${fillPercent}%`;
          glassFillEl.style.setProperty("--glass-color", timeColor);
        }
      } else if (displayMode === "seconds") {
        nextNumberText = String(state.secondsLeft);
        mainLabelEl.textContent = "sec";
        minutesEl.style.color = "";
        remainingFillEl.style.background = timeColor;
      } else {
        nextNumberText = String(state.minutesLeft);
        mainLabelEl.textContent = "min";
        minutesEl.style.color = "";
        remainingFillEl.style.background = timeColor;
      }

      if (minutesEl.textContent !== nextNumberText) {
        minutesEl.textContent = nextNumberText;
      }

      playTickOnVisibleNumberChange(nextNumberText);

      dateLabelEl.textContent = formatDateShort(now);
      if (calendarOpen) {
        renderCalendar(now);
      }
      clockEl.textContent = `${pad(state.hour)}:${pad(state.minute)}`;

      barStartLabelEl.textContent = formatTimeLabel(dayStartMinutes);
      barEndLabelEl.textContent = formatTimeLabel(dayEndMinutes);
      barStartLabelEl.setAttribute("aria-label", `Startzeit ist ${formatTimeLabel(dayStartMinutes)}.`);
      barEndLabelEl.setAttribute("aria-label", `Endzeit ist ${formatTimeLabel(dayEndMinutes)}.`);

      remainingFillEl.style.left = "auto";
      remainingFillEl.style.right = "0";

      if (state.sleepMode) {
        remainingFillEl.style.width = `${state.sleepProgressPercent}%`;
        remainingPercentEl.textContent = displayMode === "percent"
          ? `${state.minutesLeft} minutes left`
          : `${Math.round(state.sleepProgressPercent)}%`;
      } else {
        remainingFillEl.style.width = `${state.dayRemainingPercent}%`;
        remainingPercentEl.textContent = displayMode === "percent"
          ? `${state.minutesLeft} minutes left`
          : `${Math.round(state.dayRemainingPercent)}%`;
      }

      if (!document.body.classList.contains("app-ready")) {
        document.body.classList.add("app-ready");
      }
    }

    function liveLoop() {
      render();
      animationId = window.requestAnimationFrame(liveLoop);
    }

    function startLiveLoop() {
      if (animationId) {
        window.cancelAnimationFrame(animationId);
      }
      render();
      animationId = window.requestAnimationFrame(liveLoop);
    }

    function isFakeFullscreen() {
      return document.body.classList.contains("fake-fullscreen");
    }

    function setFullscreenButtonState(active) {
      toggleFullscreen.title = active ? "Exit fullscreen" : "Enter fullscreen";
      toggleFullscreen.setAttribute("aria-label", active ? "Exit fullscreen" : "Enter fullscreen");
    }

    let screenWakeLock = null;

    async function requestScreenWakeLock() {
      if (!("wakeLock" in navigator) || !navigator.wakeLock || document.hidden) return;
      try {
        if (screenWakeLock) return;
        screenWakeLock = await navigator.wakeLock.request("screen");
        screenWakeLock.addEventListener("release", () => {
          screenWakeLock = null;
        });
      } catch (error) {
        screenWakeLock = null;
      }
    }

    async function releaseScreenWakeLock() {
      if (!screenWakeLock) return;
      try {
        await screenWakeLock.release();
      } catch (error) {}
      screenWakeLock = null;
    }

    function fullscreenIsActive() {
      return Boolean(document.fullscreenElement) || Boolean(document.webkitFullscreenElement) || isFakeFullscreen();
    }

    async function syncFullscreenWakeLock() {
      if (fullscreenIsActive() && !document.hidden) {
        await requestScreenWakeLock();
      } else {
        await releaseScreenWakeLock();
      }
    }

    async function toggleFullScreenMode() {
      try {
        if (isFakeFullscreen()) {
          document.body.classList.remove("fake-fullscreen");
          setFullscreenButtonState(false);
          await syncFullscreenWakeLock();
          return;
        }

        if (document.fullscreenElement) {
          await document.exitFullscreen();
          setFullscreenButtonState(false);
          await syncFullscreenWakeLock();
          return;
        }

        const target = document.querySelector("main");

        if (target.requestFullscreen) {
          await target.requestFullscreen();
          setFullscreenButtonState(true);
          await syncFullscreenWakeLock();
          return;
        }

        if (target.webkitRequestFullscreen) {
          target.webkitRequestFullscreen();
          setFullscreenButtonState(true);
          setTimeout(syncFullscreenWakeLock, 120);
          return;
        }

        document.body.classList.add("fake-fullscreen");
        setFullscreenButtonState(true);
        await syncFullscreenWakeLock();
      } catch (error) {
        document.body.classList.add("fake-fullscreen");
        setFullscreenButtonState(true);
        await syncFullscreenWakeLock();
      }
    }

    document.addEventListener("fullscreenchange", () => {
      setFullscreenButtonState(fullscreenIsActive());
      syncFullscreenWakeLock();
    });

    document.addEventListener("webkitfullscreenchange", () => {
      setFullscreenButtonState(fullscreenIsActive());
      syncFullscreenWakeLock();
    });

    function saveTimeWindow() {
      localStorage.setItem("dayLeftStartMinutes", String(dayStartMinutes));
      localStorage.setItem("dayLeftEndMinutes", String(dayEndMinutes));
      localStorage.setItem("dayLeftStartHour", String(Math.floor(dayStartMinutes / 60)));
      localStorage.setItem("dayLeftEndHour", String(Math.floor(dayEndMinutes / 60)));
    }

    function shiftStartTime(deltaMinutes, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      dayStartMinutes = Math.max(0, Math.min(1410, dayStartMinutes + deltaMinutes));
      if (dayStartMinutes >= dayEndMinutes) {
        dayEndMinutes = Math.min(1440, dayStartMinutes + 30);
      }
      saveTimeWindow();
      playDigitFlipTick(0.90);
      render();
      showControlsBriefly();
    }

    function shiftEndTime(deltaMinutes, event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      dayEndMinutes = Math.max(30, Math.min(1440, dayEndMinutes + deltaMinutes));
      if (dayEndMinutes <= dayStartMinutes) {
        dayStartMinutes = Math.max(0, dayEndMinutes - 30);
      }
      saveTimeWindow();
      playDigitFlipTick(0.90);
      render();
      showControlsBriefly();
    }

    function toggleDisplayMode() {
      const modes = ["seconds", "minutes", "hours", "percent", "glass"];
      const currentIndex = modes.indexOf(displayMode);
      displayMode = modes[(currentIndex + 1 + modes.length) % modes.length];
      localStorage.setItem("dayLeftDisplayMode", displayMode);
      render();
    }

    numberHitAreaEl.addEventListener("click", toggleDisplayMode);
    numberHitAreaEl.addEventListener("touchend", function (event) {
      event.preventDefault();
      toggleDisplayMode();
    }, { passive: false });

    let lastCalendarPointerToggle = 0;

    dateLabelEl.addEventListener("pointerdown", function (event) {
      event.preventDefault();
      event.stopPropagation();
      lastCalendarPointerToggle = Date.now();
      toggleCalendar();
    });

    dateLabelEl.addEventListener("click", function (event) {
      event.preventDefault();
      event.stopPropagation();

      // Prevent a second toggle after touch/pointer devices synthesize a click.
      if (Date.now() - lastCalendarPointerToggle > 450) {
        toggleCalendar();
      }
    });

    dateLabelEl.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        toggleCalendar(event);
      }
    });

    calendarPopoverEl.addEventListener("pointerdown", function (event) {
      event.stopPropagation();
    });

    calendarPopoverEl.addEventListener("click", function (event) {
      event.stopPropagation();
    });

    document.addEventListener("pointerdown", function () {
      if (calendarOpen) {
        setCalendarOpen(false);
      }
    });

    startMinusEl.addEventListener("click", (event) => shiftStartTime(-30, event));
    startPlusEl.addEventListener("click", (event) => shiftStartTime(30, event));
    endMinusEl.addEventListener("click", (event) => shiftEndTime(-30, event));
    endPlusEl.addEventListener("click", (event) => shiftEndTime(30, event));

    toggleTheme.addEventListener("click", cycleTheme);

    toggleFullscreen.addEventListener("click", toggleFullScreenMode);

    if (toggleSound) {
      let lastSoundPointerToggle = 0;
      toggleSound.addEventListener("pointerdown", function (event) {
        lastSoundPointerToggle = Date.now();
        toggleTickSound(event);
      });
      toggleSound.addEventListener("click", function (event) {
        if (Date.now() - lastSoundPointerToggle > 450) {
          toggleTickSound(event);
        } else {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) startLiveLoop();
      syncFullscreenWakeLock();
    });

    window.addEventListener("focus", () => {
      startLiveLoop();
      syncFullscreenWakeLock();
    });
    window.addEventListener("pageshow", () => {
      startLiveLoop();
      syncFullscreenWakeLock();
    });

    let controlsTimer = null;
    function showControlsBriefly() {
      const settings = document.querySelector(".settings");
      settings.classList.add("is-visible");
      mainEl.classList.add("controls-visible");
      clearTimeout(controlsTimer);
      controlsTimer = setTimeout(() => {
        settings.classList.remove("is-visible");
        mainEl.classList.remove("controls-visible");
      }, 1800);
    }

    window.addEventListener("mousemove", showControlsBriefly);
    window.addEventListener("touchstart", showControlsBriefly, { passive: true });

    updateTheme();
    setSoundMode(soundMode);
    startLiveLoop();
  </script>
</body>
</html>
