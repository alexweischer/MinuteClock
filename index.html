}

.day-ring,.timer-ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform:rotate(-90deg)}

/* Timer mode: keep only the outlined number, no glass/pill backing. */
body.timer-active .day-mini::before{display:none}
body.timer-active .day-mini{ -webkit-text-stroke:0 transparent !important; paint-order:normal !important; text-shadow:none !important; filter:none !important; }

}

body.timer-active .timer-ring{opacity:0!important;pointer-events:none!important}
body.timer-active .day-ring{opacity:0!important;pointer-events:none!important}

.timer-bg{fill:none;stroke:var(--line);stroke-width:1.1}
.timer-left{fill:none;stroke:var(--fg);stroke-width:1.55;stroke-linecap:round;transition:stroke-dashoffset .06s linear}
.time{position:relative;z-index:3;font-size:clamp(52px,11.4vw,164px);color:var(--numColor,var(--fg));transition:color .18s ease;line-height:.72;letter-spacing:-.08em;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none;display:inline-flex;align-items:center;justify-content:center;height:.75em}.colon{display:inline-flex;align-items:center;justify-content:center;min-width:.20em;height:.75em;margin:0 .035em;opacity:.88}.digit{display:inline-flex;align-items:center;justify-content:center;min-width:.56em;height:.75em}.digit.percent-symbol{min-width:.32em;margin-left:.035em;letter-spacing:-.02em}
.dot-canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .22s ease;pointer-events:none}
body.minuteclock .dot-canvas{inset:0;width:100%;height:100%}
.container-viz{position:absolute;width:43%;height:63%;border:1.65px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(150,150,150,.16);opacity:0;transition:opacity .22s ease;pointer-events:none}.container-elapsed{position:absolute;left:0;right:0;top:0;height:100%;background:repeating-linear-gradient(-45deg, rgba(155,155,155,.16) 0 6px, rgba(155,155,155,.06) 6px 12px);transform-origin:top}.container-fill{position:absolute;left:0;right:0;bottom:0;height:100%;background:var(--green);transform-origin:bottom;opacity:.82;transition:background .14s linear}
body.timer-active.mode-ring .container-viz,body.timer-active.mode-ring .dot-canvas{opacity:0}
body.timer-active.mode-container .time,body.timer-active.mode-dots .time,body.timer-active.mode-shrink .time,body.timer-active.mode-fullshrink .time{opacity:0}
body.timer-active.mode-funnel .time{opacity:1;color:var(--glassText)!important;text-shadow:0 1px 2px var(--glassHalo),0 0 6px var(--glassHalo);z-index:4}
body.timer-active.mode-container .timer-ring,body.timer-active.mode-dots .timer-ring,body.timer-active.mode-shrink .timer-ring,body.timer-active.mode-funnel .timer-ring,body.timer-active.mode-fullshrink .timer-ring{opacity:0;pointer-events:none}
body.timer-active.mode-container .container-viz{opacity:1}
body.timer-active.mode-dots .dot-canvas,body.timer-active.mode-shrink .dot-canvas,body.timer-active.mode-funnel .dot-canvas,body.timer-active.mode-fullshrink .dot-canvas{opacity:1}

body.timer-active .stage{cursor:default}
body.minuteclock .timer-ring{opacity:0;pointer-events:none}

body.minuteclock.mode-container .time,body.minuteclock.mode-dots .time,body.minuteclock.mode-shrink .time,body.minuteclock.mode-funnel .time,body.minuteclock.mode-fullshrink .time{opacity:0}
body.minuteclock.mode-glass .time{opacity:1;color:var(--glassText)!important;text-shadow:0 1px 2px var(--glassHalo),0 0 6px var(--glassHalo);z-index:4}

body.minuteclock.mode-dots .dot-canvas,body.minuteclock.mode-shrink .dot-canvas,body.minuteclock.mode-funnel .dot-canvas,body.minuteclock.mode-glass .dot-canvas,body.minuteclock.mode-fullshrink .dot-canvas{opacity:1}
body.minuteclock.mode-funnel .day-ring,body.minuteclock.mode-glass .day-ring,body.minuteclock.mode-fullshrink .day-ring{opacity:0}
body.minuteclock.mode-funnel .dot-canvas,body.minuteclock.mode-glass .dot-canvas,body.minuteclock.mode-fullshrink .dot-canvas{z-index:2}
body.minuteclock.mode-container .timer-ring,body.minuteclock.mode-dots .timer-ring,body.minuteclock.mode-shrink .timer-ring,body.minuteclock.mode-funnel .timer-ring,body.minuteclock.mode-glass .timer-ring,body.minuteclock.mode-fullshrink .timer-ring{opacity:0}
.day-info{position:absolute;bottom:14.5%;left:50%;transform:translateX(-50%);display:flex;gap:16px;color:var(--muted);font-size:clamp(10px,1.2vw,13px);letter-spacing:.12em;text-transform:uppercase;opacity:.0;transition:opacity .25s ease;z-index:4}.day-info strong{font-weight:500;color:var(--fg)}body.show-controls .day-info{opacity:0;display:none}

.preset{position:absolute;left:calc(50% + (var(--ring-size) / 2) + var(--side-gap));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;opacity:0;transition:opacity .32s ease;z-index:8}body.show-controls .preset{opacity:1}
button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:0;display:grid;place-items:center;cursor:pointer;font:inherit;transition:background .14s ease,border-color .14s ease,transform .1s ease,color .14s ease}button:hover{background:var(--soft)}button:active{transform:scale(.96)}.icon-btn{width:48px;height:42px;min-width:48px;font-size:18px}.lang-btn{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}.pause{width:56px;min-width:56px}.preset button{min-width:54px;height:31px;color:var(--muted);font-size:11px;letter-spacing:.10em}.preset button.active{color:var(--fg);background:var(--soft);border-color:var(--line)}.preset .min-jump{margin-bottom:3px;text-transform:lowercase;font-size:10px;letter-spacing:.08em;color:var(--fg);background:var(--soft);border-color:var(--line)}.theme-dot{width:17px;height:17px;border-radius:50%;border:1.15px solid currentColor;background:linear-gradient(90deg,currentColor 0 50%,transparent 50%)}.full-icon{width:18px;height:18px;position:relative}.full-icon::before{content:"";position:absolute;inset:0;background:linear-gradient(currentColor,currentColor) left top/7px 1.2px no-repeat,linear-gradient(currentColor,currentColor) left top/1.2px 7px no-repeat,linear-gradient(currentColor,currentColor) right top/7px 1.2px no-repeat,linear-gradient(currentColor,currentColor) right top/1.2px 7px no-repeat,linear-gradient(currentColor,currentColor) left bottom/7px 1.2px no-repeat,linear-gradient(currentColor,currentColor) left bottom/1.2px 7px no-repeat,linear-gradient(currentColor,currentColor) right bottom/7px 1.2px no-repeat,linear-gradient(currentColor,currentColor) right bottom/1.2px 7px no-repeat}
.modehint{display:none!important}

body.timer-active .credit{
  top:calc(50% - (var(--ring-size) / 2) - 78px);
  opacity:0;
}

  body.timer-active .credit{top:calc(50% - (var(--ring-size) / 2) - 52px);}

/* Day mode credit position: align with the small timer-mode day-left number slot. */
body:not(.timer-active) .credit{
  top:calc(50% - (var(--ring-size) * .4185)) !important;
  transform:translate(-50%,-50%) !important;
}
body.timer-active .credit{display:none!important;opacity:0!important}


/* Credit sits outside the circle at the top center, never inside the ring area. */
.credit{
  top:clamp(18px,2.8vw,34px)!important;
  left:50%!important;
  transform:translateX(-50%)!important;
  width:min(54vw,430px)!important;
  z-index:5!important;
}
body.timer-active .credit{
  display:grid!important;
  opacity:0!important;
}
body.show-controls .credit,
body.timer-active.show-controls .credit{opacity:.42!important}
body:not(.timer-active) .credit{top:clamp(18px,2.8vw,34px)!important}
.mute-btn{font-size:15px;letter-spacing:0}

@media(max-width:760px){.credit{top:clamp(16px,2.4vw,26px)!important;width:min(50vw,360px)!important}.mute-btn{font-size:14px}}



/* Final: stable credit position and minimal classic mute icon */
.credit{
  top:calc(50% - (var(--ring-size) / 2) - 46px)!important;
  width:min(78vw,430px)!important;
}
body.timer-active .credit{display:none!important;opacity:0!important;}
body:not(.timer-active).show-controls .credit{opacity:.45!important;}
@media(max-width:760px){
  .credit{top:calc(50% - (var(--ring-size) / 2) - 34px)!important;width:min(66vw,360px)!important;}
}

  .credit{top:calc(50% - (var(--ring-size) / 2) - 28px)!important;width:min(70vw,320px)!important;}

.mute-btn{position:relative;font-size:0;letter-spacing:0;overflow:hidden;}
.mute-icon{position:relative;width:23px;height:18px;display:block;}
.mute-icon::before{content:"";position:absolute;left:1px;top:5px;width:7px;height:8px;border-radius:2px;background:currentColor;}
.mute-icon::after{content:"";position:absolute;left:7px;top:2px;width:11px;height:14px;background:currentColor;clip-path:polygon(0 35%,100% 0,100% 100%,0 65%);}
.mute-wave{position:absolute;left:17px;top:3px;width:8px;height:12px;border:1.6px solid currentColor;border-left:none;border-top-color:transparent;border-bottom-color:transparent;border-radius:0 999px 999px 0;opacity:.82;}
.mute-btn.is-muted .mute-wave{display:none;}

.mute-x::before{transform:rotate(45deg)}.mute-x::after{transform:rotate(-45deg)}



/* Refined unified control language: calmer capsules, consistent sizing, better readability */
:root{
  --button-h:38px;
  --button-w:50px;
  --button-bg:color-mix(in srgb,var(--bg) 88%,var(--fg) 12%);
  --button-bg-hover:color-mix(in srgb,var(--bg) 78%,var(--fg) 22%);
  --button-border:color-mix(in srgb,var(--fg) 22%,transparent);
  --button-text:color-mix(in srgb,var(--fg) 88%,var(--muted) 12%);
}
.controls{
  gap:8px!important;
  padding:7px!important;
  border:1px solid color-mix(in srgb,var(--fg) 10%,transparent)!important;
  background:color-mix(in srgb,var(--bg) 84%,transparent)!important;
  box-shadow:0 10px 28px rgba(0,0,0,.10)!important;
}
button{
  border-color:var(--button-border)!important;
  background:color-mix(in srgb,var(--bg) 94%,transparent)!important;
  color:var(--button-text)!important;
  box-shadow:none!important;
}
button:hover{
  background:var(--button-bg-hover)!important;
  border-color:color-mix(in srgb,var(--fg) 34%,transparent)!important;
  color:var(--fg)!important;
}
.icon-btn{
  width:var(--button-w)!important;
  min-width:var(--button-w)!important;
  height:var(--button-h)!important;
  font-size:16px!important;
}
.pause{
  width:var(--button-w)!important;
  min-width:var(--button-w)!important;
}
.lang-btn{
  font-size:10.5px!important;
  letter-spacing:.10em!important;
  font-weight:600!important;
}
.preset{
  gap:7px!important;
  padding:7px!important;
  border-radius:999px!important;
  background:color-mix(in srgb,var(--bg) 84%,transparent)!important;
  border:1px solid color-mix(in srgb,var(--fg) 9%,transparent)!important;
  backdrop-filter:blur(6px)!important;
}
.preset button{
  min-width:52px!important;
  height:30px!important;
  font-size:10.5px!important;
  letter-spacing:.11em!important;
  color:color-mix(in srgb,var(--fg) 65%,transparent)!important;
  background:transparent!important;
  border-color:transparent!important;
}
.preset button:hover,
.preset button.active,
.preset .min-jump{
  color:var(--fg)!important;
  background:var(--soft)!important;
  border-color:var(--button-border)!important;
}
.preset .min-jump{
  text-transform:uppercase!important;
  font-size:9.5px!important;
  letter-spacing:.13em!important;
  margin-bottom:4px!important;

  containerFill.style.background=colorForProgress(p);
  drawDots(p, initialSeconds);
}
function render(){
  setBodyMode();
  if(appMode==='minuteclock') renderMinuteClock(); else renderTimer();
  if(pauseBtn) pauseBtn.textContent=running?'Ⅱ':'▶';
  presets.forEach(b=>b.classList.toggle('active',appMode==='timer' && Number(b.dataset.min)*60===initialSeconds));
  updateTop();
}
function restoreLastMinuteMode(){
  minuteDisplayMode='glass';
  localStorage.setItem('hybridMinuteMode','glass');
}
function switchToMinuteClock(){ running=false; if(raf)cancelAnimationFrame(raf); raf=null; last=0; appMode='minuteclock'; minuteDisplayMode='glass'; render(); speakMinutesLeft(); }
function jumpToMinutesDayLeft(){ running=false; if(raf)cancelAnimationFrame(raf); raf=null; last=0; appMode='minuteclock'; restoreLastMinuteMode(); paperClick(); render(); speakMinutesLeft(); showControls(); }
function tick(now){ if(!running)return; if(!last)last=now; const e=(now-last)/1000; last=now; remaining=Math.max(0,remaining-e); render(); if(remaining<=0){switchToMinuteClock(); return} raf=requestAnimationFrame(tick); }
function start(){ if(appMode==='minuteclock'){ appMode='timer'; } if(remaining<=0)remaining=initialSeconds; running=true; last=performance.now(); if(raf)cancelAnimationFrame(raf); raf=requestAnimationFrame(tick); render(); }
function pause(){ running=false; if(raf)cancelAnimationFrame(raf); raf=null; last=0; render(); }
function setSeconds(sec,auto=true){
  const keepMode = appMode==='timer' ? displayMode : (timerModes.includes(minuteDisplayMode) ? minuteDisplayMode : displayMode);
  appMode='timer';
  displayMode = timerModes.includes(keepMode) ? keepMode : 'funnel';
  initialSeconds=Math.max(1,sec);
  remaining=initialSeconds;
  if(auto)start(); else {pause(); render();}
}
function reset(){ appMode='timer'; displayMode='funnel'; remaining=initialSeconds; pause(); }
function paperClick(){ try{const AC=AudioContext||webkitAudioContext,ctx=new AC(),t=ctx.currentTime; const buf=ctx.createBuffer(1,ctx.sampleRate*.055,ctx.sampleRate),data=buf.getChannelData(0); for(let i=0;i<data.length;i++){data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2.8)} const src=ctx.createBufferSource();src.buffer=buf; const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=720; const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3300; const g=ctx.createGain();g.gain.setValueAtTime(.038,t);g.gain.exponentialRampToValueAtTime(.0001,t+.06);src.connect(hp).connect(lp).connect(g).connect(ctx.destination);src.start(t);src.stop(t+.065);setTimeout(()=>ctx.close(),160)}catch(e){} }
function warmSpeechVoices(){try{ if('speechSynthesis' in window) window.speechSynthesis.getVoices(); }catch(e){}}
if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged=warmSpeechVoices; warmSpeechVoices(); }
function speakableMinuteNumber(n){
  n=Math.max(0,Math.round(n));
  const ones=['zero','one','two','three','four','five','six','seven','eight','nine'];
  const teens=['ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  function twoDigits(x){
    x=Math.max(0,Math.min(99,Math.round(x)));
    if(x<10) return ones[x];
    if(x<20) return teens[x-10];
    const t=Math.floor(x/10), o=x%10;
    return tens[t]+(o?' '+ones[o]:'');
  }
  if(n<100) return twoDigits(n);
  const s=String(n);
  const prefix=s.slice(0,-2).split('').map(ch=>ones[Number(ch)]).join(' ');
  const last=Number(s.slice(-2));
  if(last===0) return prefix+' zero zero';
  if(last<10) return prefix+' oh '+ones[last];
  return prefix+' '+twoDigits(last);
}

function speakableCardinalNoAnd(n){
  n=Math.max(0,Math.round(n));
  const ones=['zero','one','two','three','four','five','six','seven','eight','nine'];
  const teens=['ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  function under100(x){
    x=Math.max(0,Math.min(99,Math.round(x)));
    if(x<10) return ones[x];
    if(x<20) return teens[x-10];
    const t=Math.floor(x/10), o=x%10;
    return tens[t]+(o?' '+ones[o]:'');
  }
  function under1000(x){
    if(x<100) return under100(x);
    const h=Math.floor(x/100), rest=x%100;
    return ones[h]+' hundred'+(rest?' '+under100(rest):'');
  }
  if(n<1000) return under1000(n);
  const th=Math.floor(n/1000), rest=n%1000;
  return under1000(th)+' thousand'+(rest?' '+under1000(rest):'');
}
function robotSpeechText(text){
  return String(text).trim().replace(/\s+/g,' ');
}

function pickVoiceForCurrentLanguage(preferFemale=false){
  try{
    const voices=window.speechSynthesis.getVoices();
    const clean=v=>!/whisper|hysterical|bells|organ|cellos|bad news|boing|trinoids|zarvox|junior|novelty|robot/i.test(v.name);
    const english=v=>/^en([-_]|$)/i.test(v.lang||'') || /english/i.test(v.name||'');
    const female=/\b(samantha|victoria|karen|serena|ava|susan|zira|hazel|allison|joanna|jenny|aria|natasha|moira|fiona|tessa|salli|female|woman)\b/i;
    const male=/\b(alex|daniel|david|tom|george|oliver|aaron|fred|ralph|albert|bruce|reed|eddy|gordon|thomas|arthur|matthew|ryan|guy|male|man)\b/i;
    const role=preferFemale?female:male;
    const opposite=preferFemale?male:female;
    return voices.find(v=>english(v)&&role.test(v.name)&&clean(v))
      || voices.find(v=>english(v)&&!opposite.test(v.name)&&clean(v))
      || voices.find(v=>english(v)&&clean(v))
      || voices.find(v=>clean(v));
  }catch(e){return null}
}

function pickMaleRobotVoice(){ return pickVoiceForCurrentLanguage(false); }
function pickFemaleRobotVoice(){ return pickVoiceForCurrentLanguage(true); }
function pickRobotVoice(){ return pickMaleRobotVoice(); }

function speakRobotPhrase(text, volume=.34, onDone=null, cancelCurrent=true, opts={}){
  try{
    if(speechMuted) return;
    if(!('speechSynthesis' in window)) return;
    if(cancelCurrent) window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(robotSpeechText(text));
    u.lang=currentSpeechLang().lang;
    u.rate=opts.rate ?? .84;
    u.pitch=opts.pitch ?? .82;
    u.volume=opts.volume ?? volume;
    const voice=(opts.voicePicker||pickRobotVoice)();
    if(voice){
      u.voice=voice;
      // Keep utterance language aligned with the selected voice so browsers do not silently
      // switch back to their default, often female, system voice.
      if(voice.lang) u.lang=voice.lang;
    }
    if(onDone) u.onend=()=>setTimeout(onDone,opts.pause ?? 250);
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function speakableChineseNumber(n){
  n=Math.max(0,Math.round(n));
  const d=['零','一','二','三','四','五','六','七','八','九'];
  function under100(x){
    if(x<10) return d[x];
    const t=Math.floor(x/10), o=x%10;
    let out=(t===1?'十':d[t]+'十');
    if(o) out+=d[o];
    return out;
  }
  function under1000(x){
    if(x<100) return under100(x);
    const h=Math.floor(x/100), rest=x%100;
    let out=d[h]+'百';
    if(rest===0) return out;
    if(rest<10) return out+'零'+d[rest];
    return out+under100(rest);
  }
  if(n<1000) return under1000(n);
  const th=Math.floor(n/1000), rest=n%1000;
  let out=under100(th)+'千';
  if(rest===0) return out;
  if(rest<100) return out+'零'+under100(rest);
  return out+under1000(rest);
}

function speakableMalayalamNumber(n){
  n=Math.max(0,Math.round(n));
  const ones=['പൂജ്യം','ഒന്ന്','രണ്ട്','മൂന്ന്','നാല്','അഞ്ച്','ആറ്','ഏഴ്','എട്ട്','ഒൻപത്'];
  const teens=['പത്ത്','പതിനൊന്ന്','പന്ത്രണ്ട്','പതിമൂന്ന്','പതിനാല്','പതിനഞ്ച്','പതിനാറ്','പതിനേഴ്','പതിനെട്ട്','പത്തൊൻപത്'];
  const tens=['','','ഇരുപത്','മുപ്പത്','നാൽപ്പത്','അമ്പത്','അറുപത്','എഴുപത്','എൺപത്','തൊണ്ണൂറ്'];
  function under100(x){
    x=Math.max(0,Math.min(99,Math.round(x)));
    if(x<10) return ones[x];
    if(x<20) return teens[x-10];
    const t=Math.floor(x/10), o=x%10;
    return tens[t]+(o?' '+ones[o]:'');
  }
  function under1000(x){
    if(x<100) return under100(x);
    const h=Math.floor(x/100), rest=x%100;
    // Use an explicit “three hundred four” style so Malayalam TTS says the hundred unit,
    // instead of reading the value as separated digits.
    return ones[h]+' നൂറ്'+(rest?' '+under100(rest):'');
  }
  if(n<1000) return under1000(n);
  const th=Math.floor(n/1000), rest=n%1000;
  return under100(th)+' ആയിരം'+(rest?' '+under1000(rest):'');
}

function speakableGermanNumber(n){
  n=Math.max(0,Math.round(n));
  const ones=['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];
  const onesCompound=['','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];
  const teens=['zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
  const tens=['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];
  function under100(x){
    x=Math.max(0,Math.min(99,Math.round(x)));
    if(x<10) return ones[x];
    if(x<20) return teens[x-10];
    const t=Math.floor(x/10), o=x%10;
    if(!o) return tens[t];
    return onesCompound[o]+'und'+tens[t];
  }
  function under1000(x){
    if(x<100) return under100(x);
    const h=Math.floor(x/100), rest=x%100;
    const prefix=(h===1?'ein':onesCompound[h])+'hundert';
    return prefix+(rest?' '+under100(rest):'');
  }
  if(n<1000) return under1000(n);
  const th=Math.floor(n/1000), rest=n%1000;
  const prefix=(th===1?'eintausend':under1000(th)+'tausend');
  return prefix+(rest?' '+under1000(rest):'');
}

function speechTextForNumber(n,{preset=false}={}){
  return preset ? speakableMinuteNumber(n) : speakableCardinalNoAnd(n);
}

function speakPresetNumber(mins){
  // Preset start cue: only the selected number, in the selected speech language.
  speakRobotPhrase(speechTextForNumber(mins,{preset:true}), .58, null, true, {rate:.96,pitch:.92,volume:.58,voicePicker:pickMaleRobotVoice});
}

function speakMinutesLeft(){
  const d=dayData();
  const mins=Math.max(0,Math.ceil(d.left/60));
  // Timer-end / exit cue: remaining day minutes in selected language; female-leaning when available.
  speakRobotPhrase(speechTextForNumber(mins), .40, null, true, {rate:.94,pitch:1.02,volume:.40,voicePicker:pickFemaleRobotVoice});
}

dayStartPlus.addEventListener('click',(e)=>{e.stopPropagation(); adjustDayBoundary('start',30);});
dayEndMinus.addEventListener('click',(e)=>{e.stopPropagation(); adjustDayBoundary('end',-30);});
dayEndPlus.addEventListener('click',(e)=>{e.stopPropagation(); adjustDayBoundary('end',30);});
if(minuteJump) minuteJump.addEventListener('click',(e)=>{e.stopPropagation(); jumpToMinutesDayLeft();});
function handleDayMiniExit(e){
  if(e){
    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation) e.stopImmediatePropagation();
  }
  if(appMode==='timer') jumpToMinutesDayLeft();
}
if(dayMini) {
  ['pointerdown','mousedown','touchstart','click'].forEach(ev=>{
    dayMini.addEventListener(ev,handleDayMiniExit,{capture:true,passive:false});
  });
  dayMini.addEventListener('keydown',(e)=>{
    if((e.key==='Enter'||e.key===' ') && appMode==='timer') handleDayMiniExit(e);
  },{capture:true});
}
presets.forEach(b=>b.addEventListener('click',()=>{const mins=Number(b.dataset.min); paperClick(); setSeconds(mins*60,true); speakPresetNumber(mins);}));

if(stage) {
  stage.addEventListener('click',(e)=>{
    if(appMode==='timer'){
      e.preventDefault();
      e.stopPropagation();
      paperClick();
      running ? pause() : start();
      showControls();
    }
  });
}

themeBtn.addEventListener('click',()=>{paperClick(); themeIndex=(themeIndex+1)%themes.length; setTheme(); render()}); if(muteBtn) muteBtn.addEventListener('click',()=>{paperClick(); speechMuted=!speechMuted; if(speechMuted && 'speechSynthesis' in window) window.speechSynthesis.cancel(); updateMuteButton(); showControls();}); fullBtn.addEventListener('click',async()=>{paperClick(); try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}});
function showControls(){document.body.classList.add('show-controls'); clearTimeout(hide); hide=setTimeout(()=>document.body.classList.remove('show-controls'),2300)} ['mousemove','touchstart','pointerdown','keydown'].forEach(ev=>window.addEventListener(ev,()=>{showControls();warmSpeechVoices();},{passive:true}));
// Always open in Day-Left glass mode, regardless of prior timer state.
appMode='minuteclock';
minuteDisplayMode='glass';
running=false;
