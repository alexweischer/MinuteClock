<!doctype html>
<html lang="en">
<head>
  <!-- app-version: v57-large-fullscreen-slim-clean-bar -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Day Left" />
  <title>Day Left</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --fg: #f4f1ea;
      --muted: rgba(244, 241, 234, 0.58);
      --line: rgba(244, 241, 234, 0.18);
      --track: rgba(244, 241, 234, 0.14);
      --orange: #d96a19;
      --yellow: #746a3c;
      --mint: #4b7470;
      --danger-bg: #160606;
      --danger-fg: #fff0ee;
      --danger-muted: rgba(255, 240, 238, 0.62);
      --danger-line: rgba(217, 74, 67, 0.34);
      --danger-red: #d94a43;
      --danger-track: rgba(217, 74, 67, 0.20);
      --time-1000: #4caf50;
      --time-900: #63b84c;
      --time-800: #86bd45;
      --time-700: #a8bd3d;
      --time-600: #c7b935;
      --time-500: #d9a52e;
      --time-400: #dc8628;
      --time-300: #d96a22;
      --time-200: #d4511f;
      --time-100: #cc3428;
      --time-0: #b91f1f;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    main {
      width: min(94vw, 760px);
      aspect-ratio: 1 / 1;
      max-height: 94dvh;
      border: 1px solid var(--line);
      border-radius: 34px;
      padding: clamp(24px, 4.8vw, 46px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(20px, 3vw, 34px);
      position: relative;
      background: var(--bg);
      color: var(--fg);
      box-shadow: 0 18px 60px rgba(0,0,0,0.24);
    }

    .settings {
      position: absolute;
      left: 50%;
      top: clamp(18px, 4vw, 34px);
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    main:hover .settings,
    main:focus-within .settings,
    .settings.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .icon-button {
      appearance: none;
      -webkit-appearance: none;
      width: 34px;
      height: 34px;
      min-width: 34px;
      min-height: 34px;
      border: 1px solid var(--line);
      color: var(--fg);
      background: transparent;
      border-radius: 50%;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-sizing: border-box;
    }

    .theme-dot {
      width: 13px;
      height: 13px;
      min-width: 13px;
      min-height: 13px;
      max-width: 13px;
      max-height: 13px;
      display: block;
      background: var(--fg);
      border-radius: 50%;
      flex: 0 0 13px;
      box-sizing: border-box;
    }
.fullscreen-button svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fullscreen-exit {
      display: none;
    }

    :fullscreen .fullscreen-enter {
      display: none;
    }

    :fullscreen .fullscreen-exit {
      display: block;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      color: var(--muted);
      font-size: clamp(10px, 1.8vw, 13px);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }

    #clock {
      color: var(--mint);
    }

    #dateLabel {
      color: var(--yellow);
    }

    .countdown {
      text-align: center;
      transition: color 240ms ease;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: clamp(10px, 2vw, 18px);
      min-height: 0;
      position: relative;
    }
#minutes {
      font-size: clamp(108px, 24vw, 220px);
      font-weight: 500;
      line-height: 0.80;
      letter-spacing: -0.065em;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .label {
      color: var(--fg);
      font-size: clamp(13px, 2.4vw, 20px);
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      opacity: 0.70;
    }


    #numberHitArea {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -58%);
      width: min(78vw, 520px);
      height: clamp(130px, 28vw, 260px);
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0;
      cursor: pointer;
      z-index: 4;
      appearance: none;
      -webkit-appearance: none;
    }

    #numberHitArea:focus-visible {
      outline: 1px solid var(--fg);
      outline-offset: 6px;
      border-radius: 18px;
    }

    .remaining-section {
      width: min(76%, 540px);
      justify-self: center;
      align-self: end;
      display: grid;
      gap: 8px;
    }

    .remaining-labels {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      align-items: center;
      color: var(--muted);
      font-size: clamp(9px, 1.5vw, 11px);
      letter-spacing: 0.09em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }

    .remaining-labels span:nth-child(2) {
      text-align: center;
    }

    #remainingPercent {
      color: var(--muted);
    }

    .remaining-labels span:nth-child(3) {
      text-align: right;
    }

    .remaining-track {
      position: relative;
      width: 100%;
      height: 6px;
      background: var(--track);
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      display: block;
    }

    .remaining-fill {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: 100%;
      background: var(--orange);
      border-radius: 999px;
      display: block;
      transition: width 0.25s linear, background 240ms ease;
    }

    .light {
      --bg: #f4f1ea;
      --fg: #111;
      --muted: rgba(17, 17, 17, 0.55);
      --line: rgba(17, 17, 17, 0.16);
      --track: rgba(17, 17, 17, 0.10);
      --yellow: #8c7a24;
      --mint: #3f827c;
      --danger-bg: #fff0ee;
      --danger-fg: #210504;
      --danger-muted: rgba(33, 5, 4, 0.56);
      --danger-line: rgba(185, 59, 53, 0.30);
      --danger-red: #b93b35;
      --danger-track: rgba(185, 59, 53, 0.14);
    }

    body.tomorrow-mode {
      --bg: var(--danger-bg);
      --fg: var(--danger-fg);
      --muted: var(--danger-muted);
      --line: var(--danger-line);
      --track: var(--danger-track);
      --orange: var(--danger-red);
      --yellow: var(--danger-red);
      --mint: var(--danger-red);
    }

    body.tomorrow-mode #minutes,
    body.tomorrow-mode .label,
    body.tomorrow-mode #clock,
    body.tomorrow-mode #dateLabel,
    body.tomorrow-mode #remainingPercent,
    body.tomorrow-mode .remaining-labels,
    body.tomorrow-mode .icon-button {
      color: var(--danger-red);
      text-shadow: none;
    }

    body.tomorrow-mode .remaining-fill {
      left: 0;
      right: auto;
    }

    body.tomorrow-mode .remaining-track {
      border-color: var(--danger-line);
      background: var(--danger-track);
    }

    body.tomorrow-mode main {
      box-shadow: none;
    }

    /* Large readable fullscreen display */
    main:fullscreen {
      width: 100vw;
      height: 100dvh;
      max-height: none;
      aspect-ratio: auto;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      padding: max(28px, env(safe-area-inset-top)) max(52px, env(safe-area-inset-right)) max(36px, env(safe-area-inset-bottom)) max(52px, env(safe-area-inset-left));
      grid-template-rows: auto 1fr auto;
      gap: clamp(24px, 3.4vw, 44px);
    }

    main:fullscreen #minutes {
      font-size: clamp(230px, 38vw, 560px);
      line-height: 0.68;
      letter-spacing: -0.09em;
    }

    main:fullscreen .label {
      font-size: clamp(36px, 5.4vw, 82px);
      letter-spacing: 0.035em;
      opacity: 0.78;
    }

    main:fullscreen .countdown {
      gap: clamp(22px, 3.6vw, 42px);
    }

    main:fullscreen .remaining-section {
      width: min(78vw, 980px);
      gap: 10px;
    }

    main:fullscreen .remaining-labels {
      font-size: clamp(14px, 1.8vw, 22px);
    }

    main:fullscreen .remaining-track {
      height: 6px;
    }

    main:-webkit-full-screen {
      width: 100vw;
      height: 100dvh;
      max-height: none;
      aspect-ratio: auto;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      padding: max(28px, env(safe-area-inset-top)) max(52px, env(safe-area-inset-right)) max(36px, env(safe-area-inset-bottom)) max(52px, env(safe-area-inset-left));
      grid-template-rows: auto 1fr auto;
      gap: clamp(24px, 3.4vw, 44px);
    }

    main:-webkit-full-screen #minutes {
      font-size: clamp(230px, 38vw, 560px);
      line-height: 0.68;
      letter-spacing: -0.09em;
    }

    main:-webkit-full-screen .label {
      font-size: clamp(36px, 5.4vw, 82px);
      letter-spacing: 0.035em;
      opacity: 0.78;
    }

    main:-webkit-full-screen .countdown {
      gap: clamp(22px, 3.6vw, 42px);
    }

    main:-webkit-full-screen .remaining-section {
      width: min(78vw, 980px);
      gap: 10px;
    }

    main:-webkit-full-screen .remaining-labels {
      font-size: clamp(14px, 1.8vw, 22px);
    }

    main:-webkit-full-screen .remaining-track {
      height: 6px;
    }

    
    main:fullscreen .remaining-fill,
    main:-webkit-full-screen .remaining-fill {
      border-radius: 999px;
    }

    @media (orientation: landscape) and (max-height: 900px) {
      main:fullscreen #minutes,
      main:-webkit-full-screen #minutes {
        font-size: clamp(210px, 34vw, 460px);
      }

      main:fullscreen .label,
      main:-webkit-full-screen .label {
        font-size: clamp(30px, 4.4vw, 64px);
      }
    }

@media (max-width: 520px) {
      main {
        border-radius: 26px;
      }

  
    #numberHitArea {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -58%);
      width: min(78vw, 520px);
      height: clamp(130px, 28vw, 260px);
      border: 0;
      background: transparent;
      padding: 0;
      margin: 0;
      cursor: pointer;
      z-index: 4;
      appearance: none;
      -webkit-appearance: none;
    }

    #numberHitArea:focus-visible {
      outline: 1px solid var(--fg);
      outline-offset: 6px;
      border-radius: 18px;
    }

    .remaining-section {
        width: min(88%, 390px);
      }
    }
  </style>
</head>
<body>
  <main aria-label="Minutes left today">
    <div class="settings" aria-label="Settings">
      <button id="toggleTheme" class="icon-button theme-button" type="button" aria-label="Toggle light and dark mode" title="Toggle theme">
        <span class="theme-dot" aria-hidden="true"></span>
      </button>
<button id="toggleFullscreen" class="icon-button fullscreen-button" type="button" aria-label="Enter fullscreen" title="Fullscreen">
        <svg class="fullscreen-enter" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
        </svg>
        <svg class="fullscreen-exit" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
        </svg>
      </button>
    </div>

    <div class="top">
      <div id="dateLabel">1 JUN</div>
      <div id="clock">--:--</div>
    </div>

    <section class="countdown">
      <div id="minutes">1440</div>
      <button id="numberHitArea" type="button" aria-label="Toggle between minutes and percent left today"></button>
      <div id="mainLabel" class="label">minutes left today</div>
    </section>

    <section class="remaining-section" aria-label="Remaining time from 8:00 to 24:00">
      <div class="remaining-labels">
        <span id="barStartLabel">8:00</span>
        <span id="remainingPercent">100%</span>
        <span id="barEndLabel">24:00</span>
      </div>
      <div class="remaining-track">
        <div id="remainingFill" class="remaining-fill"></div>
      </div>
    </section>
</main>

  <script>
    const minutesEl = document.getElementById("minutes");
    const mainLabelEl = document.getElementById("mainLabel");
    const numberHitAreaEl = document.getElementById("numberHitArea");
    const clockEl = document.getElementById("clock");
    const dateLabelEl = document.getElementById("dateLabel");
    const remainingFillEl = document.getElementById("remainingFill");
    const remainingPercentEl = document.getElementById("remainingPercent");
    const barStartLabelEl = document.getElementById("barStartLabel");
    const barEndLabelEl = document.getElementById("barEndLabel");
    const toggleTheme = document.getElementById("toggleTheme");
    const toggleFullscreen = document.getElementById("toggleFullscreen");

    let lightMode = localStorage.getItem("dayLeftTheme") === "light";
    let displayMode = localStorage.getItem("dayLeftDisplayMode") || "minutes";
    let animationId = null;

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function formatDateShort(date) {
      const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
      return `${date.getDate()} ${months[date.getMonth()]}`;
    }

    function updateTheme() {
      document.body.classList.toggle("light", lightMode);
      toggleTheme.title = lightMode ? "Dark mode" : "Light mode";
      toggleTheme.setAttribute("aria-label", lightMode ? "Switch to dark mode" : "Switch to light mode");
      localStorage.setItem("dayLeftTheme", lightMode ? "light" : "dark");
    }

    function getState(now) {
      const hour = now.getHours();
      const minute = now.getMinutes();

      // Sleep mode: between 00:00 and 07:59, show minutes remaining until 8:00.
      const sleepMode = hour < 8;

      const end = new Date(now);
      end.setHours(24, 0, 0, 0);

      const wakeStart = new Date(now);
      wakeStart.setHours(8, 0, 0, 0);

      const midnightStart = new Date(now);
      midnightStart.setHours(0, 0, 0, 0);

      const remainingUntilMidnightMs = Math.max(0, end.getTime() - now.getTime());
      const remainingUntilWakeMs = Math.max(0, wakeStart.getTime() - now.getTime());

      const minutesLeft = sleepMode
        ? Math.max(0, Math.ceil(remainingUntilWakeMs / 60000))
        : Math.max(0, Math.ceil(remainingUntilMidnightMs / 60000));

      const dayWindowMs = end.getTime() - wakeStart.getTime();
      const dayRemainingMs = Math.max(0, end.getTime() - Math.max(now.getTime(), wakeStart.getTime()));
      const dayRemainingPercent = Math.min(100, Math.max(0, (dayRemainingMs / dayWindowMs) * 100));

      const sleepWindowMs = wakeStart.getTime() - midnightStart.getTime();
      const sleepElapsedMs = Math.max(0, Math.min(now.getTime(), wakeStart.getTime()) - midnightStart.getTime());
      const sleepProgressPercent = Math.min(100, Math.max(0, (sleepElapsedMs / sleepWindowMs) * 100));

      const displayPercent = sleepMode
        ? Math.round(100 - sleepProgressPercent)
        : Math.round(dayRemainingPercent);

      return {
        minutesLeft,
        dayRemainingPercent,
        sleepProgressPercent,
        displayPercent,
        sleepMode,
        hour,
        minute
      };
    }

    function getTimeColor(minutesLeft) {
      if (minutesLeft >= 900) return "var(--time-1000)";
      if (minutesLeft >= 800) return "var(--time-900)";
      if (minutesLeft >= 700) return "var(--time-800)";
      if (minutesLeft >= 600) return "var(--time-700)";
      if (minutesLeft >= 500) return "var(--time-600)";
      if (minutesLeft >= 400) return "var(--time-500)";
      if (minutesLeft >= 300) return "var(--time-400)";
      if (minutesLeft >= 200) return "var(--time-300)";
      if (minutesLeft >= 100) return "var(--time-200)";
      if (minutesLeft >= 1) return "var(--time-100)";
      return "var(--time-0)";
    }

    function render() {
      const now = new Date();
      const state = getState(now);

      document.body.classList.toggle("tomorrow-mode", state.sleepMode);

      const timeColor = getTimeColor(state.minutesLeft);

      if (displayMode === "percent") {
        minutesEl.textContent = state.displayPercent;
        mainLabelEl.textContent = "percent left today";
        minutesEl.style.color = timeColor;
        remainingFillEl.style.background = timeColor;
      } else {
        minutesEl.textContent = state.minutesLeft;
        mainLabelEl.textContent = state.sleepMode ? "minutes sleep" : "minutes left today";
        minutesEl.style.color = "";
        remainingFillEl.style.background = "var(--orange)";
      }

      dateLabelEl.textContent = formatDateShort(now);
      clockEl.textContent = `${pad(state.hour)}:${pad(state.minute)}`;

      if (state.sleepMode) {
        barStartLabelEl.textContent = "24:00";
        barEndLabelEl.textContent = "8:00";
        remainingFillEl.style.width = `${state.sleepProgressPercent}%`;
        remainingPercentEl.textContent = displayMode === "percent"
          ? `${state.minutesLeft} minutes left`
          : `${Math.round(state.sleepProgressPercent)}%`;
      } else {
        barStartLabelEl.textContent = "8:00";
        barEndLabelEl.textContent = "24:00";
        remainingFillEl.style.width = `${state.dayRemainingPercent}%`;
        remainingPercentEl.textContent = displayMode === "percent"
          ? `${state.minutesLeft} minutes left`
          : `${Math.round(state.dayRemainingPercent)}%`;
      }
    }

    function liveLoop() {
      render();
      animationId = window.requestAnimationFrame(liveLoop);
    }

    function startLiveLoop() {
      if (animationId) {
        window.cancelAnimationFrame(animationId);
      }
      render();
      animationId = window.requestAnimationFrame(liveLoop);
    }

    async function toggleFullScreenMode() {
      try {
        if (!document.fullscreenElement) {
          await document.querySelector("main").requestFullscreen();
          toggleFullscreen.title = "Exit fullscreen";
          toggleFullscreen.setAttribute("aria-label", "Exit fullscreen");
        } else {
          await document.exitFullscreen();
          toggleFullscreen.title = "Enter fullscreen";
          toggleFullscreen.setAttribute("aria-label", "Enter fullscreen");
        }
      } catch (error) {
        console.warn("Fullscreen mode is not available:", error);
      }
    }

    document.addEventListener("fullscreenchange", () => {
      toggleFullscreen.title = document.fullscreenElement ? "Exit fullscreen" : "Enter fullscreen";
      toggleFullscreen.setAttribute("aria-label", document.fullscreenElement ? "Exit fullscreen" : "Enter fullscreen");
    });

    function toggleDisplayMode() {
      displayMode = displayMode === "minutes" ? "percent" : "minutes";
      localStorage.setItem("dayLeftDisplayMode", displayMode);
      render();
    }

    numberHitAreaEl.addEventListener("click", toggleDisplayMode);
    numberHitAreaEl.addEventListener("touchend", function (event) {
      event.preventDefault();
      toggleDisplayMode();
    }, { passive: false });

    toggleTheme.addEventListener("click", () => {
      lightMode = !lightMode;
      updateTheme();
      render();
    });

    toggleFullscreen.addEventListener("click", toggleFullScreenMode);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) startLiveLoop();
    });

    window.addEventListener("focus", startLiveLoop);
    window.addEventListener("pageshow", startLiveLoop);

    let controlsTimer = null;
    function showControlsBriefly() {
      const settings = document.querySelector(".settings");
      settings.classList.add("is-visible");
      clearTimeout(controlsTimer);
      controlsTimer = setTimeout(() => {
        settings.classList.remove("is-visible");
      }, 1800);
    }

    window.addEventListener("mousemove", showControlsBriefly);
    window.addEventListener("touchstart", showControlsBriefly, { passive: true });

    updateTheme();
    startLiveLoop();
  </script>
</body>
</html>
